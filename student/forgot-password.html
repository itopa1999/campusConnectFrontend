<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>CampusHub – Forgot Password</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- Global Styles (student version) -->
    <link rel="stylesheet" href="/assets/css/student/style.css" />
    <link rel="icon" type="image/jpeg" href="../assets/img/icon.jpg" />

    <style>
        /* ─── All existing styles ──────────────────────────────────── */
        .forgot-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-app);
            padding: 20px;
            transition: background var(--transition);
        }

        .forgot-container {
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
        }

        .forgot-card {
            background: var(--bg-card);
            border-radius: var(--radius-card);
            padding: 40px 32px 36px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-card);
            transition: background var(--transition), border-color var(--transition), box-shadow var(--transition);
        }

        .forgot-card .brand {
            text-align: center;
            margin-bottom: 24px;
        }

        .forgot-card .brand .brand-icon {
            font-size: 40px;
            color: var(--green);
            display: block;
            margin-bottom: 6px;
            transition: color var(--transition);
        }

        .forgot-card .brand h1 {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-primary);
            margin: 0;
            letter-spacing: -0.5px;
            transition: color var(--transition);
        }

        .forgot-card .brand h1 span {
            color: var(--green);
            transition: color var(--transition);
        }

        .forgot-card .brand p {
            font-size: 14px;
            color: var(--text-muted);
            margin: 4px 0 0;
            transition: color var(--transition);
        }

        .forgot-card .subtitle {
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.5;
            transition: color var(--transition);
        }

        .forgot-card .subtitle i {
            color: var(--green);
            margin-right: 4px;
            transition: color var(--transition);
        }

        .forgot-card .form-group {
            margin-bottom: 18px;
        }

        .forgot-card .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
            transition: color var(--transition);
        }

        .forgot-card .form-group .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--bg-input);
            border-radius: 12px;
            border: 2px solid var(--border-color);
            transition: all 0.25s ease;
        }

        .forgot-card .form-group .input-wrap:focus-within {
            border-color: var(--green);
            box-shadow: 0 0 0 4px rgba(13, 138, 62, 0.10);
            background: var(--bg-card);
        }

        .forgot-card .form-group .input-wrap.error {
            border-color: var(--red);
            box-shadow: 0 0 0 4px rgba(231, 76, 60, 0.10);
        }

        .forgot-card .form-group .input-wrap.success {
            border-color: var(--green);
        }

        .forgot-card .form-group .input-wrap .input-icon {
            padding: 0 0 0 14px;
            color: var(--text-muted);
            font-size: 16px;
            transition: color var(--transition);
            flex-shrink: 0;
        }

        .forgot-card .form-group .input-wrap:focus-within .input-icon {
            color: var(--green);
        }

        .forgot-card .form-group .input-wrap input {
            width: 100%;
            padding: 12px 14px;
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: color var(--transition);
        }

        .forgot-card .form-group .input-wrap input::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
            transition: color var(--transition);
        }

        /* ─── ✅ FIX: Override global .form-input styles ──────────── */
        .forgot-card .form-group .input-wrap input.form-input {
            border: none !important;
            background: transparent !important;
            padding: 12px 14px !important;
            box-shadow: none !important;
            border-radius: 0 !important;
            margin: 0 !important;
        }
        .forgot-card .form-group .input-wrap input.form-input.error,
        .forgot-card .form-group .input-wrap input.form-input.success {
            box-shadow: none !important;
            border: none !important;
        }

        .forgot-card .form-group .help-text {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
            transition: color var(--transition);
        }

        .forgot-card .form-group .help-text.error {
            color: var(--red);
        }

        .forgot-card .form-group .help-text.success {
            color: var(--green);
        }

        .forgot-card .btn-reset {
            width: 100%;
            padding: 13px 0;
            border-radius: 30px;
            border: none;
            background: var(--green);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 16px rgba(13, 138, 62, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: inherit;
            margin-top: 4px;
        }

        .forgot-card .btn-reset:hover:not(:disabled) {
            opacity: 0.9;
            transform: scale(0.98);
        }

        .forgot-card .btn-reset:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .forgot-card .btn-reset .spinner {
            display: none;
        }

        .forgot-card .btn-reset.loading .spinner {
            display: inline-block;
            margin-right: 6px;
        }

        .forgot-card .btn-reset.loading .btn-text {
            display: none;
        }

        .forgot-card .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 22px 0 18px;
            color: var(--text-muted);
            font-size: 12px;
            transition: color var(--transition);
        }

        .forgot-card .divider::before,
        .forgot-card .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
            transition: background var(--transition);
        }

        .forgot-card .back-to-login {
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
            transition: color var(--transition);
        }

        .forgot-card .back-to-login a {
            color: var(--green);
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s;
        }

        .forgot-card .back-to-login a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        .forgot-card .alert {
            display: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 16px;
            border: 1px solid transparent;
        }

        .forgot-card .alert.visible {
            display: block;
        }

        .forgot-card .alert.error {
            background: rgba(231, 76, 60, 0.08);
            border-color: rgba(231, 76, 60, 0.25);
            color: var(--red);
        }

        .forgot-card .alert.success {
            background: rgba(13, 138, 62, 0.08);
            border-color: rgba(13, 138, 62, 0.25);
            color: var(--green);
        }

        .dark-mode .forgot-card .alert.error {
            background: rgba(231, 76, 60, 0.12);
            border-color: rgba(231, 76, 60, 0.3);
        }

        .dark-mode .forgot-card .alert.success {
            background: rgba(13, 138, 62, 0.12);
            border-color: rgba(13, 138, 62, 0.3);
        }

        @media (max-width: 480px) {
            .forgot-card { padding: 28px 20px 24px; }
            .forgot-card .brand h1 { font-size: 22px; }
            .forgot-card .brand .brand-icon { font-size: 32px; }
            .forgot-card .btn-reset { font-size: 15px; padding: 12px 0; }
        }

        @media (min-width: 768px) {
            .forgot-container { max-width: 460px; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }
    </style>
</head>
<body>

    <div class="forgot-page">
        <div class="forgot-container">
            <div class="forgot-card">

                <!-- Brand -->
                <div class="brand">
                    <span class="brand-icon"><i class="fa-solid fas fa-graduation-cap"></i></span>
                    <h1>Campus<span>Hub</span></h1>
                    <p>Reset your password</p>
                </div>

                <!-- Subtitle -->
                <div class="subtitle">
                    <i class="fa-regular fas fa-envelope"></i>
                    Enter the email address associated with your account and we'll send you a link to reset your password.
                </div>

                <!-- Alert -->
                <div class="alert" id="forgotAlert"></div>

                <!-- Form -->
                <form id="forgotFormElement" autocomplete="off" novalidate>

                    <!-- Email -->
                    <div class="form-group">
                        <label for="resetEmail">Email Address</label>
                        <div class="input-wrap" id="emailWrap">
                            <span class="input-icon"><i class="fa-regular fas fa-envelope"></i></span>
                            <!-- ✅ Added class="form-input" -->
                            <input
                            type="email"
                            id="resetEmail"
                            class="form-input"
                            placeholder="you@uniben.edu"
                            required
                            autocomplete="email"
                            />
                        </div>
                        <div class="help-text" id="emailHelp"></div>
                    </div>

                    <!-- Submit -->
                    <button type="submit" class="btn-reset" id="sendLinkBtn">
                        <span class="spinner"><i class="fa-solid fas fa-spinner fas fa-spin"></i></span>
                        <span class="btn-text"><i class="fa-regular fas fa-paper-plane"></i> Send reset link</span>
                    </button>

                </form>

                <!-- Divider -->
                <div class="divider">or</div>

                <!-- Back to Login -->
                <div class="back-to-login">
                    <a href="login.html"><i class="fa-regular fas fa-arrow-left"></i> Back to Sign In</a>
                </div>

            </div>
        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script src="/assets/js/student/global.js"></script>
    <script src="/assets/js/student/modal.js"></script>
    <script src="/assets/js/student/showAlert.js"></script>

    <!-- ✅ Load the form helper -->
    <script src="/assets/js/student/form-helpers.js"></script>

    <script>
        (function() {
            'use strict';

            // ─── DOM refs ──────────────────────────────────────────────
            const form = document.getElementById('forgotFormElement');
            const emailInput = document.getElementById('resetEmail');
            const resetBtn = document.getElementById('sendLinkBtn');
            const alertEl = document.getElementById('forgotAlert');

            const FORGOT_PASSWORD_URL = `${AUTH_URL}forgot-password`;
            const COUNTDOWN_STORAGE_KEY = 'forgotPasswordCountdown';
            const resetOriginalText = 'Send reset link';
            const X_KEY_ID = 1;

            // ─── Helpers ──────────────────────────────────────────────
            function showAlert(message, type = 'error') {
                alertEl.textContent = message;
                alertEl.className = 'alert visible ' + type;
            }

            function hideAlert() {
                alertEl.className = 'alert';
                alertEl.textContent = '';
            }

            function setButtonLoading(btn, loading) {
                if (loading) {
                    btn.disabled = true;
                    btn.classList.add('loading');
                } else {
                    btn.disabled = false;
                    btn.classList.remove('loading');
                }
            }

            // ─── Countdown Timer ──────────────────────────────────────
            function startCountdown(button, duration = 90) {
                let timeLeft = duration;
                button.disabled = true;

                const endTime = Date.now() + (timeLeft * 1000);
                localStorage.setItem(COUNTDOWN_STORAGE_KEY, endTime);

                const updateButton = () => {
                    const minutes = Math.floor(timeLeft / 60);
                    const seconds = timeLeft % 60;
                    const displayText = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                    button.textContent = displayText;
                };

                updateButton();

                const interval = setInterval(() => {
                    timeLeft--;
                    if (timeLeft <= 0) {
                        clearInterval(interval);
                        button.disabled = false;
                        button.innerHTML = `<span class="btn-text"><i class="fa-regular fas fa-paper-plane"></i> ${resetOriginalText}</span>`;
                        localStorage.removeItem(COUNTDOWN_STORAGE_KEY);
                    } else {
                        updateButton();
                    }
                }, 1000);
            }

            function checkAndRestoreCountdown() {
                const endTime = localStorage.getItem(COUNTDOWN_STORAGE_KEY);
                if (endTime) {
                    const now = Date.now();
                    const timeLeft = Math.ceil((endTime - now) / 1000);
                    if (timeLeft > 0) {
                        startCountdown(resetBtn, timeLeft);
                    } else {
                        localStorage.removeItem(COUNTDOWN_STORAGE_KEY);
                        resetBtn.disabled = false;
                        resetBtn.innerHTML = `<span class="btn-text"><i class="fa-regular fas fa-paper-plane"></i> ${resetOriginalText}</span>`;
                    }
                }
            }

            // ─── Validation (uses CampusForms) ──────────────────────
            function validateAndUpdateButton() {
                hideAlert();
                const result = CampusForms.validateForm(form);
                resetBtn.disabled = !result.isValid;
                return result.isValid;
            }

            emailInput.addEventListener('input', validateAndUpdateButton);

            // ─── Submit ──────────────────────────────────────────────
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                if (!validateAndUpdateButton()) return;

                hideAlert();
                setButtonLoading(resetBtn, true);

                const email = emailInput.value.trim();

                try {
                    const response = await fetch(FORGOT_PASSWORD_URL, {
                        method: 'POST',
                        headers: {
                            'Accept': 'application/json',
                            'Content-Type': 'application/json',
                            'X-Key-Id': X_KEY_ID,
                        },
                        credentials: 'include',
                        body: JSON.stringify({ email })
                    });

                    const result = await response.json();

                    if (response.ok && result.is_success === true) {
                        showAlert(result.message || `Password reset link sent to ${email}. Check your inbox.`, 'success');
                        form.reset();
                        // Start countdown
                        startCountdown(resetBtn, 90);
                    } else {
                        const errorMsg = result.message || 'Failed to send reset link. Please try again.';
                        showAlert(errorMsg, 'error');
                        setButtonLoading(resetBtn, false);
                        form.style.animation = 'shake 0.4s ease';
                        setTimeout(() => { form.style.animation = ''; }, 400);
                    }

                } catch (err) {
                    console.error('Forgot password error:', err);
                    showAlert('Network error. Could not connect to server.', 'error');
                    setButtonLoading(resetBtn, false);
                }
            });

            // ─── Init ──────────────────────────────────────────────────
            if (window.isAuthenticated && window.isAuthenticated()) {
                window.location.href = 'dashboard.html';
                return;
            }

            // Restore countdown if exists
            checkAndRestoreCountdown();

            // Pre-fill email from URL param
            const urlParams = new URLSearchParams(window.location.search);
            const emailParam = urlParams.get('email');
            if (emailParam) {
                emailInput.value = emailParam;
                validateAndUpdateButton();
            }

            setTimeout(() => emailInput.focus(), 300);
            validateAndUpdateButton();

            console.log('🔑 Forgot password page initialized with CampusForms.');

            window.__forgot = {
                form,
                validateForm: validateAndUpdateButton,
                payload: () => ({ email: emailInput.value.trim() })
            };

        })();
    </script>

</body>
</html>
