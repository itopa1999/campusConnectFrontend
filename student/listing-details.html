<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>CampusHub – Listing Details</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- Global Styles -->
    <link rel="stylesheet" href="/assets/css/studentStyle.css" />
    <link rel="icon" type="image/jpeg" href="../assets/img/icon.jpg">

    <style>
        /* ──────────────────────────────────────────────────────────────
           PREMIUM REDESIGN – Listing Details
           ────────────────────────────────────────────────────────────── */

        .details-wrapper {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 20px 20px;
        }

        /* ─── Back Button ─── */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 40px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-decoration: none;
            margin-bottom: 24px;
            box-shadow: var(--shadow-card);
        }
        .back-btn:hover {
            background: var(--green-bg);
            border-color: var(--green);
            color: var(--green);
            transform: translateX(-6px) scale(1.02);
            box-shadow: 0 8px 24px rgba(13, 138, 62, 0.15);
        }
        .back-btn i {
            transition: transform 0.3s ease;
        }
        .back-btn:hover i {
            transform: translateX(-4px);
        }

        /* ─── Hero Section ─── */
        .hero-section {
            position: relative;
            width: 100%;
            height: 460px;
            border-radius: var(--radius-card);
            overflow: hidden;
            background: var(--bg-input);
            margin-bottom: 28px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.08);
        }
        .hero-section .hero-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s ease;
        }
        .hero-section:hover .hero-image {
            transform: scale(1.02);
        }
        .hero-section .image-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            background: var(--bg-input);
            font-size: 80px;
            color: var(--text-muted2);
        }
        .hero-section .hero-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 48px 36px 32px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8) 0%, transparent 100%);
            color: #fff;
        }
        .hero-section .hero-overlay .hero-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }
        .hero-section .hero-overlay .hero-badges .badge {
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            backdrop-filter: blur(8px);
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .hero-section .hero-overlay .hero-badges .badge.hot {
            background: #e74c3c;
            border-color: #e74c3c;
            animation: pulse-badge 2s ease-in-out infinite;
        }
        .hero-section .hero-overlay .hero-badges .badge.free {
            background: #2ecc71;
            border-color: #2ecc71;
        }
        .hero-section .hero-overlay .hero-badges .badge.banner {
            background: #8e44ad;
            border-color: #8e44ad;
        }
        .hero-section .hero-overlay .hero-badges .badge.verified {
            background: #3498db;
            border-color: #3498db;
        }
        @keyframes pulse-badge {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .hero-section .hero-overlay .hero-title {
            font-size: 34px;
            font-weight: 800;
            margin: 0 0 6px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            letter-spacing: -0.5px;
        }
        .hero-section .hero-overlay .hero-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 24px;
            font-size: 14px;
            opacity: 0.92;
        }
        .hero-section .hero-overlay .hero-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .hero-section .hero-overlay .hero-meta i {
            font-size: 13px;
            opacity: 0.8;
        }

        .hero-section .share-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }
        .hero-section .share-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        /* ─── Content Grid ─── */
        .details-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 32px;
            margin-top: 8px;
        }

        /* ─── Main Column ─── */
        .main-col {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* ─── Price Card ─── */
        .price-card {
            background: var(--bg-card);
            border-radius: var(--radius-card);
            padding: 24px 28px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-card);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }
        .price-card .price-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .price-card .price-left .price-label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .price-card .price-number {
            font-size: 36px;
            font-weight: 800;
            color: var(--green);
            letter-spacing: -0.5px;
        }
        .price-card .price-number .free {
            font-size: 22px;
            background: var(--green-bg);
            padding: 4px 20px;
            border-radius: 30px;
            color: var(--green);
        }
        .price-card .price-number .negotiable {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-muted);
            margin-left: 12px;
        }
        .price-card .price-number .per-month {
            font-size: 16px;
            font-weight: 400;
            color: var(--text-muted);
            margin-left: 4px;
        }
        .price-card .price-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .price-card .price-actions .btn-contact {
            padding: 12px 32px;
            border-radius: 40px;
            background: var(--green);
            color: #fff;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            box-shadow: 0 4px 16px rgba(13, 138, 62, 0.25);
        }
        .price-card .price-actions .btn-contact:hover {
            opacity: 0.9;
            transform: scale(0.97) translateY(-2px);
            box-shadow: 0 8px 32px rgba(13, 138, 62, 0.35);
        }
        .price-card .price-actions .btn-like {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .price-card .price-actions .btn-like:hover {
            border-color: var(--red);
            color: var(--red);
            transform: scale(1.05);
        }
        .price-card .price-actions .btn-like.active {
            border-color: var(--red);
            color: var(--red);
            background: rgba(231, 76, 60, 0.06);
            animation: like-pop 0.4s ease;
        }
        @keyframes like-pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* ─── Cards ─── */
        .info-card {
            background: var(--bg-card);
            border-radius: var(--radius-card);
            padding: 24px 28px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-card);
            transition: all 0.3s ease;
        }
        .info-card:hover {
            box-shadow: var(--shadow-card-hover);
        }
        .info-card .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 17px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 14px;
        }
        .info-card .card-header i {
            color: var(--green);
            font-size: 20px;
            width: 28px;
            text-align: center;
        }
        .info-card .card-header .badge-count {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            background: var(--bg-input);
            padding: 2px 12px;
            border-radius: 30px;
            margin-left: auto;
        }

        .info-card .description-text {
            font-size: 15px;
            line-height: 1.8;
            color: var(--text-secondary);
            white-space: pre-wrap;
        }

        /* ─── Type-Specific Details ─── */
        .type-details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 32px;
        }
        .type-details-grid .detail-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            gap: 16px;
        }
        .type-details-grid .detail-item:last-child {
            border-bottom: none;
        }
        .type-details-grid .detail-item .label {
            color: var(--text-muted);
            font-weight: 500;
            flex-shrink: 0;
        }
        .type-details-grid .detail-item .value {
            color: var(--text-primary);
            font-weight: 600;
            text-align: right;
            word-break: break-word;
        }
        .type-details-grid .detail-item .value .icon-check { color: var(--green); }
        .type-details-grid .detail-item .value .icon-times { color: var(--red); }
        .type-details-grid .detail-item .category-pill {
            display: inline-block;
            padding: 3px 14px;
            border-radius: 20px;
            background: var(--green-bg);
            color: var(--green);
            font-size: 12px;
            font-weight: 600;
        }
        .type-details-grid .detail-item .category-pill i { margin-right: 4px; }

        .amenities-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: flex-end;
        }
        .amenities-tags .tag {
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            background: var(--bg-input);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        /* ─── Reviews ─── */
        .reviews-card .review-summary {
            display: flex;
            align-items: center;
            gap: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .reviews-card .review-summary .big-rating {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .reviews-card .review-summary .big-rating .rating-number {
            font-size: 36px;
            font-weight: 800;
            color: var(--text-primary);
        }
        .reviews-card .review-summary .big-rating .stars-lg {
            display: flex;
            gap: 3px;
            color: var(--star);
            font-size: 18px;
        }
        .reviews-card .review-summary .big-rating .stars-lg .empty {
            color: var(--text-muted2);
            opacity: 0.3;
        }
        .reviews-card .review-summary .review-count-text {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .review-item {
            padding: 16px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .review-item:last-child { border-bottom: none; }
        .review-item .review-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px 12px;
            margin-bottom: 4px;
        }
        .review-item .review-head .reviewer {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .review-item .review-head .reviewer .avatar-sm {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--green-bg);
            color: var(--green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            flex-shrink: 0;
        }
        .review-item .review-head .reviewer .from-label {
            font-weight: 400;
            color: var(--text-muted);
            font-size: 12px;
        }
        .review-item .review-head .stars-sm {
            display: flex;
            gap: 2px;
            color: var(--star);
            font-size: 13px;
        }
        .review-item .review-head .stars-sm .empty {
            color: var(--text-muted2);
            opacity: 0.3;
        }
        .review-item .review-comment {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 4px;
            line-height: 1.6;
            padding-left: 42px;
        }
        .review-item .review-date {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
            padding-left: 42px;
        }
        .no-reviews {
            text-align: center;
            padding: 32px 20px;
            color: var(--text-muted);
        }
        .no-reviews i {
            font-size: 40px;
            opacity: 0.25;
            display: block;
            margin-bottom: 10px;
        }
        .no-reviews p {
            font-size: 14px;
            margin: 0;
        }

        /* ─── Sidebar ─── */
        .sidebar-col {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* ─── Seller Card ─── */
        .seller-card {
            background: var(--bg-card);
            border-radius: var(--radius-card);
            padding: 28px 24px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-card);
            text-align: center;
            transition: all 0.3s ease;
        }
        .seller-card:hover {
            box-shadow: var(--shadow-card-hover);
        }
        .seller-card .seller-avatar-lg {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            margin: 0 auto 14px;
            border: 4px solid var(--green);
            background: var(--green-bg);
            color: var(--green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            font-weight: 700;
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        .seller-card .seller-avatar-lg:hover {
            transform: scale(1.05);
        }
        .seller-card .seller-avatar-lg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .seller-card .seller-name {
            font-size: 19px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .seller-card .seller-name .privacy-icon {
            font-size: 13px;
            color: var(--text-muted);
            margin-left: 6px;
        }
        .seller-card .seller-name .you-tag {
            font-size: 12px;
            font-weight: 400;
            color: var(--text-muted);
            margin-left: 8px;
            background: var(--bg-input);
            padding: 2px 12px;
            border-radius: 20px;
        }
        .seller-card .seller-meta {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 6px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 4px 16px;
        }
        .seller-card .seller-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .seller-card .seller-meta i {
            color: var(--green);
            font-size: 12px;
        }
        .seller-card .seller-badges {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin: 14px 0 18px;
        }
        .seller-card .seller-badges .badge-pill {
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            background: var(--bg-input);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .seller-card .seller-badges .badge-pill.verified {
            background: var(--green-bg);
            color: var(--green);
            border-color: var(--green);
        }
        .seller-card .seller-badges .badge-pill i { font-size: 11px; }

        .seller-card .trust-row {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 16px 0 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }
        .seller-card .trust-row .trust-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
        }
        .seller-card .trust-row .trust-bar-track {
            flex: 1;
            height: 6px;
            background: var(--border-color);
            border-radius: 10px;
            overflow: hidden;
        }
        .seller-card .trust-row .trust-bar-track .trust-bar-fill {
            height: 100%;
            border-radius: 10px;
            background: var(--green);
            width: 0%;
            transition: width 1s ease;
        }
        .seller-card .trust-row .trust-score {
            font-size: 15px;
            font-weight: 700;
            min-width: 44px;
            text-align: right;
        }

        .seller-card .btn-profile {
            width: 100%;
            padding: 12px;
            border-radius: 40px;
            border: 2px solid var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
        }
        .seller-card .btn-profile:hover {
            background: var(--green-bg);
            border-color: var(--green);
            color: var(--green);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(13, 138, 62, 0.12);
        }

        /* ─── Loading / Error ─── */
        .loading-state,
        .error-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }
        .loading-state .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--border-color);
            border-top-color: var(--green);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-state p {
            font-size: 15px;
            font-weight: 500;
        }
        .error-state .error-icon {
            font-size: 64px;
            opacity: 0.3;
            margin-bottom: 16px;
            display: block;
            color: var(--red);
        }
        .error-state h3 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
        }
        .error-state p {
            font-size: 14px;
            color: var(--text-muted);
            max-width: 400px;
            margin: 0 auto;
        }
        .error-state .btn-explore {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 36px;
            border-radius: 40px;
            background: var(--green);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .error-state .btn-explore:hover {
            opacity: 0.9;
            transform: scale(0.97);
            box-shadow: 0 8px 32px rgba(13, 138, 62, 0.3);
        }

        /* ─── Responsive ─── */
        @media (max-width: 1024px) {
            .hero-section {
                height: 380px;
            }
            .hero-section .hero-overlay .hero-title {
                font-size: 28px;
            }
        }
        @media (max-width: 992px) {
            .details-grid {
                grid-template-columns: 1fr;
            }
            .sidebar-col {
                flex-direction: row;
                flex-wrap: wrap;
            }
            .sidebar-col > * {
                flex: 1 1 300px;
            }
            .type-details-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (max-width: 768px) {
            .hero-section {
                height: 300px;
            }
            .hero-section .hero-overlay {
                padding: 28px 20px 20px;
            }
            .hero-section .hero-overlay .hero-title {
                font-size: 22px;
            }
            .hero-section .hero-overlay .hero-meta {
                font-size: 12px;
                gap: 4px 14px;
            }
            .hero-section .share-btn {
                width: 38px;
                height: 38px;
                font-size: 15px;
                top: 14px;
                right: 14px;
            }
            .price-card {
                padding: 18px 20px;
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .price-card .price-actions {
                justify-content: center;
            }
            .price-card .price-number {
                font-size: 28px;
            }
            .price-card .price-actions .btn-contact {
                padding: 10px 24px;
                font-size: 13px;
            }
            .price-card .price-actions .btn-like {
                width: 42px;
                height: 42px;
                font-size: 17px;
            }
            .info-card {
                padding: 18px 20px;
            }
            .info-card .card-header {
                font-size: 15px;
            }
            .type-details-grid {
                grid-template-columns: 1fr;
                gap: 0;
            }
            .type-details-grid .detail-item {
                padding: 8px 0;
                font-size: 13px;
            }
            .seller-card {
                padding: 20px;
            }
            .seller-card .seller-avatar-lg {
                width: 72px;
                height: 72px;
                font-size: 28px;
            }
            .seller-card .seller-name {
                font-size: 17px;
            }
            .reviews-card .review-summary .big-rating .rating-number {
                font-size: 28px;
            }
            .review-item .review-comment {
                padding-left: 0;
                margin-top: 6px;
            }
            .review-item .review-date {
                padding-left: 0;
            }
            .reviews-card .review-summary {
                gap: 10px;
            }
        }
        @media (max-width: 480px) {
            .details-wrapper {
                padding: 0 12px 12px;
            }
            .hero-section {
                height: 220px;
                border-radius: 14px;
            }
            .hero-section .hero-overlay .hero-title {
                font-size: 18px;
            }
            .hero-section .hero-overlay .hero-meta {
                font-size: 11px;
                gap: 4px 10px;
            }
            .hero-section .hero-overlay .hero-badges .badge {
                font-size: 9px;
                padding: 2px 10px;
            }
            .price-card .price-number {
                font-size: 24px;
            }
            .price-card .price-number .free {
                font-size: 18px;
                padding: 2px 14px;
            }
            .price-card .price-number .negotiable {
                font-size: 13px;
                display: block;
                margin-left: 0;
                margin-top: 4px;
            }
            .price-card .price-actions .btn-contact {
                padding: 8px 16px;
                font-size: 12px;
                gap: 6px;
            }
            .price-card .price-actions .btn-like {
                width: 38px;
                height: 38px;
                font-size: 15px;
            }
            .info-card {
                padding: 14px 16px;
            }
            .info-card .card-header {
                font-size: 14px;
            }
            .info-card .description-text {
                font-size: 14px;
            }
            .seller-card .seller-avatar-lg {
                width: 60px;
                height: 60px;
                font-size: 22px;
            }
            .seller-card .seller-name {
                font-size: 15px;
            }
            .seller-card .seller-meta {
                font-size: 12px;
            }
            .seller-card .trust-row .trust-label {
                font-size: 12px;
            }
            .seller-card .trust-row .trust-score {
                font-size: 13px;
            }
            .reviews-card .review-summary .big-rating .rating-number {
                font-size: 24px;
            }
            .reviews-card .review-summary .big-rating .stars-lg {
                font-size: 15px;
            }
            .review-item .review-head .reviewer {
                font-size: 13px;
            }
            .review-item .review-comment {
                font-size: 13px;
            }
            .back-btn {
                font-size: 12px;
                padding: 6px 14px;
                margin-bottom: 16px;
            }
        }

        /* ─── Smooth fade-in ─── */
        #listingContent {
            animation: fadeUp 0.6s ease forwards;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .info-card {
            animation: fadeUp 0.6s ease forwards;
        }
        .info-card:nth-child(2) { animation-delay: 0.05s; }
        .info-card:nth-child(3) { animation-delay: 0.1s; }
        .info-card:nth-child(4) { animation-delay: 0.15s; }
        .sidebar-col > * {
            animation: fadeUp 0.6s ease forwards;
        }
        .sidebar-col > *:nth-child(2) { animation-delay: 0.1s; }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- ===== LOCATION ===== -->
        <div class="location-bar">
            <i class="fa-solid fa-location-dot"></i>
            <div class="loc-text">
                University of Benin <span>• Ugbowo</span>

        </div>

        <!-- ===== MAIN ===== -->
        <main class="main-content" style="padding-top: 12px;">

            <div class="details-wrapper">

                <!-- Back Button -->
                <a href="explore.html" class="back-btn">
                    <i class="fa-solid fa-chevron-left"></i> Back to Explore
                </a>

                <!-- Loading State -->
                <div id="listingLoading" class="loading-state">

                    <p>The listing you are looking for does not exist or has been removed.</p>
                    <a href="explore.html" class="btn-explore">Go to Explore</a>

                <!-- Main Content -->
                <div id="listingContent" style="display:none;">

                    <!-- Hero Section -->
                    <div class="hero-section" id="heroSection">
                        <!-- Populated by JS -->

                        </button>
                    </div>

                    <!-- Content Grid -->
                    <div class="details-grid">

                        <!-- Main Column -->
                        <div class="main-col">

                            <!-- Price & Actions -->
                            <div class="price-card" id="priceCard">

                                    <span class="price-label">Price</span>
                                    <span class="price-number" id="priceDisplay"></span>

                                <div class="price-actions">
                                    <button class="btn-contact" id="contactSellerBtn">
                                        <i class="fa-regular fa-comment"></i> Contact Seller
                                    </button>
                                    <button class="btn-like" id="likeBtn" aria-label="Like this listing">
                                        <i class="fa-regular fa-heart"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Description -->
                            <div class="info-card">
                                <div class="card-header">
                                    <i class="fa-regular fa-align-left"></i>
                                    <span>Description</span>
                                </div>
                                <div class="description-text" id="listingDescription"></div>
                            </div>

                            <!-- Type-Specific Details -->
                            <div class="info-card" id="typeDetailsCard">
                                <div class="card-header">
                                    <i class="fa-regular fa-circle-info" id="typeIcon"></i>
                                    <span id="typeLabel">Listing Details</span>
                                </div>
                                <div class="type-details-grid" id="typeDetailsGrid"></div>

                            <!-- Reviews -->
                            <div class="info-card reviews-card" id="reviewsCard">

                            <!-- Seller Card -->

                            </div>

                            <!-- You could add additional sidebar widgets here (e.g., map, similar listings) -->

                        </div>

                </div>

            </div>

        </main>

        <!-- ===== DEMO NOTE ===== -->
        <div class="demo-note">
            <span>CampusHub</span> • Listing Details
        </div>

    </div>

    <!-- ===== SCRIPTS ===== -->
    <script src="/assets/js/studentGlobal.js"></script>
    <script src="/assets/js/modal.js"></script>
    <script src="/assets/js/showAlert.js"></script>

    <script>
        (function() {
            'use strict';

            // ─── DOM refs ──────────────────────────────────────────────
            const loadingEl = document.getElementById('listingLoading');
            const errorEl = document.getElementById('listingError');
            const contentEl = document.getElementById('listingContent');

            const heroSection = document.getElementById('heroSection');
            const priceDisplay = document.getElementById('priceDisplay');
            const listingDescription = document.getElementById('listingDescription');
            const typeLabel = document.getElementById('typeLabel');
            const typeIcon = document.getElementById('typeIcon');
            const typeDetailsGrid = document.getElementById('typeDetailsGrid');
            const sellerCard = document.getElementById('sellerCard');
            const reviewSummary = document.getElementById('reviewSummary');
            const reviewsList = document.getElementById('reviewsList');
            const contactSellerBtn = document.getElementById('contactSellerBtn');
            const likeBtn = document.getElementById('likeBtn');
            const shareBtn = document.getElementById('shareBtn');

            // ─── Get listing ID from URL ──────────────────────────────
            function getListingId() {
                const params = new URLSearchParams(window.location.search);
                const id = params.get('id');
                return id ? parseInt(id) : null;
            }

            // ─── API endpoint ──────────────────────────────────────────
            const LISTING_DETAILS_API = `${CAMPUS_URL}listing-details`;

            // ─── Fetch listing details ─────────────────────────────────
            async function fetchListingDetails(listingId) {
                try {
                    const response = await fetchWithAuth(`${LISTING_DETAILS_API}/${listingId}`, {
                        method: 'GET',
                        showSpinner: true,
                        spinnerText: 'Loading listing...'
                    });
                    if (!response.ok) {
                        throw new Error('Failed to fetch listing details');
                    }
                    const result = await response.json();
                    if (!result.is_success) {
                        throw new Error(result.message || 'Failed to load listing');
                    }
                    return result.data;
                } catch (error) {
                    console.error('Listing details error:', error);
                    throw error;
                }
            }

            // ─── Helpers ──────────────────────────────────────────────
            function getInitials(name) {
                if (!name) return '?';
                const parts = name.trim().split(' ');
                if (parts.length >= 2) {
                    return (parts[0][0] + parts[1][0]).toUpperCase();
                }
                return name.substring(0, 2).toUpperCase();
            }

            function formatDate(dateStr) {
                if (!dateStr) return 'Recently';
                try {
                    const date = new Date(dateStr);
                    return date.toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'short',
                        day: 'numeric'
                    });
                } catch (e) {
                    return dateStr;
                }
            }

            function renderStars(rating, size = 'sm') {
                const full = Math.floor(rating || 0);
                const half = (rating % 1) >= 0.5 ? 1 : 0;
                const empty = 5 - full - half;
                let html = '';
                const cls = size === 'lg' ? 'stars-lg' : 'stars-sm';
                for (let i = 0; i < full; i++) html += '<i class="fa-solid fa-star"></i>';
                if (half) html += '<i class="fa-regular fa-star-half-stroke"></i>';
                for (let i = 0; i < empty; i++) html += '<i class="fa-regular fa-star empty"></i>';
                return `<span class="${cls}">${html}</span>`;
            }

            // ─── Render listing ─────────────────────────────────────────
            function renderListing(data) {
                if (!data) {
                    showError('Listing not found');
                    return;
                }

                // ─── Hero Image ──────────────────────────────────────────
                const imgSrc = data.image || '';
                const heroBadges = [];
                if (data.is_hot_sale) heroBadges.push('hot');
                if (data.price === 0 && data.listing_type !== 'Accommodation') heroBadges.push('free');
                if (data.is_ads_banner) heroBadges.push('banner');
                if (data.listing_type === 'Accommodation') heroBadges.push('verified');

                const heroBadgesHtml = heroBadges.map(cls => `<span class="badge ${cls}">${cls === 'hot' ? '🔥 Hot' : cls === 'free' ? '🎁 Free' : cls === 'banner' ? '📢 Promoted' : '🏠 Accommodation'}</span>`).join('');

                const listingTypeMap = {
                    'Sell': 'Sell',
                    'Service': 'Service',
                    'Accommodation': 'Accommodation'
                };
                const typeLabelText = listingTypeMap[data.listing_type] || data.listing_type || 'Listing';

                let heroMetaHtml = `
                    <span><i class="fa-regular fa-tag"></i> ${typeLabelText}</span>
                    <span><i class="fa-regular fa-location-dot"></i> ${data.hotspots?.[0] || 'Campus'}</span>
                    <span><i class="fa-regular fa-clock"></i> ${data.created_at || 'Recently'}</span>
                `;
                if (data.auto_reactivate) {
                    heroMetaHtml += `<span><i class="fa-solid fa-rotate"></i> Auto-reactivate</span>`;
                }
                if (data.is_ads_banner) {
                    heroMetaHtml += `<span><i class="fa-regular fa-bullhorn" style="color:#8e44ad;"></i> Promoted</span>`;
                }

                heroSection.innerHTML = `
                    ${imgSrc ? `<img src="${imgSrc}" alt="${data.title || 'Listing'}" class="hero-image" loading="lazy" />` : `<div class="image-placeholder"><i class="fa-regular fa-image"></i></div>`}
                    <div class="hero-overlay">
                        <div class="hero-badges">${heroBadgesHtml}</div>
                        <div class="hero-title">${data.title || 'Untitled Listing'}</div>
                        <div class="hero-meta">${heroMetaHtml}</div>
                    </div>
                `;

                // ─── Share button ──────────────────────────────────────
                shareBtn.addEventListener('click', function() {
                    if (navigator.share) {
                        navigator.share({
                            title: data.title || 'CampusHub Listing',
                            text: `Check out this listing: ${data.title || ''}`,
                            url: window.location.href
                        }).catch(() => {});
                    } else {
                        navigator.clipboard?.writeText(window.location.href).then(() => {
                            showToast('Link copied to clipboard! 📋', 'success');
                        }).catch(() => {
                            showToast('Share this listing by copying the URL.', 'info');
                        });
                    }
                });

                // ─── Price ──────────────────────────────────────────────
                const price = data.price || 0;
                const isFree = price === 0 && data.listing_type !== 'Accommodation';
                let priceHtml = '';
                if (isFree) {
                    priceHtml = `<span class="free">FREE</span>`;
                } else if (data.listing_type === 'Accommodation') {
                    const rent = data.details?.rent_price || 0;
                    priceHtml = `₦${rent.toLocaleString()} <span class="per-month">/ month</span>`;
                } else {
                    priceHtml = `₦${price.toLocaleString()}`;
                }
                if (data.negotiation) {
                    priceHtml += ` <span class="negotiable"><i class="fa-regular fa-handshake"></i> Negotiable</span>`;
                }
                priceDisplay.innerHTML = priceHtml;

                // ─── Description ────────────────────────────────────────
                listingDescription.textContent = data.description || 'No description provided.';

                // ─── Type-Specific Details ─────────────────────────────
                const details = data.details || {};
                const listingType = data.listing_type;

                let gridHtml = '';
                let sectionLabel = '';
                let iconClass = 'fa-regular fa-list';

                if (listingType === 'Sell') {
                    sectionLabel = 'Item Details';
                    iconClass = 'fa-regular fa-tag';
                    const items = [];
                    if (details.category) {
                        const icon = details.category.icon ? `<i class="${details.category.icon}"></i> ` : '';
                        items.push({ label: 'Category', value: `<span class="category-pill">${icon}${details.category.name}</span>` });
                    }
                    if (details.subcategory) {
                        const icon = details.subcategory.icon ? `<i class="${details.subcategory.icon}"></i> ` : '';
                        items.push({ label: 'Subcategory', value: `<span class="category-pill">${icon}${details.subcategory.name}</span>` });
                    }
                    items.push(
                        { label: 'Condition', value: details.condition || '—' },
                        { label: 'Brand', value: details.brand || '—' },
                        { label: 'Model', value: details.model || '—' },
                        { label: 'Quantity', value: details.quantity || 1 },
                        { label: 'Warranty', value: details.warranty || '—' }
                    );
                    gridHtml = items.map(item => `
                        <div class="detail-item">
                            <span class="label">${item.label}</span>
                            <span class="value">${item.value}</span>
                        </div>
                    `).join('');

                } else if (listingType === 'Service') {
                    sectionLabel = 'Service Details';
                    iconClass = 'fa-regular fa-hand-sparkles';
                    const items = [];
                    if (details.category) {
                        const icon = details.category.icon ? `<i class="${details.category.icon}"></i> ` : '';
                        items.push({ label: 'Category', value: `<span class="category-pill">${icon}${details.category.name}</span>` });
                    }
                    if (details.subcategory) {
                        const icon = details.subcategory.icon ? `<i class="${details.subcategory.icon}"></i> ` : '';
                        items.push({ label: 'Subcategory', value: `<span class="category-pill">${icon}${details.subcategory.name}</span>` });
                    }
                    items.push(
                        { label: 'Delivery Time', value: details.delivery_time || '—' },
                        { label: 'Service Duration', value: details.service_duration || '—' },
                        { label: 'Experience', value: details.experience ? `${details.experience} years` : '—' },
                        { label: 'Portfolio', value: details.portfolio ? `<a href="${details.portfolio}" target="_blank" style="color:var(--green);font-weight:600;">View Portfolio</a>` : '—' },
                        { label: 'Available Online', value: details.online_available ? '<span class="icon-check"><i class="fa-solid fa-check-circle"></i> Yes</span>' : '<span class="icon-times"><i class="fa-regular fa-circle-xmark"></i> No</span>' }
                    );
                    gridHtml = items.map(item => `
                        <div class="detail-item">
                            <span class="label">${item.label}</span>
                            <span class="value">${item.value}</span>
                        </div>
                    `).join('');

                } else if (listingType === 'Accommodation') {
                    sectionLabel = 'Accommodation Details';
                    iconClass = 'fa-regular fa-building';
                    const amenities = [];
                    if (details.electricity) amenities.push('⚡ Electricity');
                    if (details.water) amenities.push('💧 Water');
                    if (details.security) amenities.push('🛡️ Security');
                    if (details.parking) amenities.push('🅿️ Parking');
                    const amenitiesStr = amenities.length ? amenities.map(a => `<span class="tag">${a}</span>`).join('') : 'None listed';

                    const genderMap = { 'M': 'Male', 'F': 'Female', 'A': 'Any', 'Any': 'Any' };
                    const studentTypeMap = { 'UG': 'Undergrad', 'G': 'Graduate', 'A': 'Any', 'Any': 'Any' };

                    const items = [
                        { label: 'Purpose', value: details.purpose || '—' },
                        { label: 'Property Type', value: details.property_type || '—' },
                        { label: 'Bedrooms', value: details.bedrooms || 1 },
                        { label: 'Bathrooms', value: details.bathrooms || 1 },
                        { label: 'Furnished', value: details.furnished ? '<span class="icon-check"><i class="fa-solid fa-check-circle"></i> Yes</span>' : '<span class="icon-times"><i class="fa-regular fa-circle-xmark"></i> No</span>' },
                        { label: 'Available From', value: details.available_from ? formatDate(details.available_from) : '—' },
                        { label: 'Lease Duration', value: details.lease_duration || '—' },
                        { label: 'Amenities', value: `<div class="amenities-tags">${amenitiesStr}</div>` },
                        { label: 'Distance to Campus', value: details.distance_to_campus || '—' },
                        { label: 'Preferred Gender', value: genderMap[details.preferred_gender] || details.preferred_gender || 'Any' },
                        { label: 'Preferred Student Type', value: studentTypeMap[details.preferred_student_type] || details.preferred_student_type || 'Any' },
                        { label: 'Max Occupants', value: details.max_occupants || 1 },
                        { label: 'Roommate Notes', value: details.roommate_notes || '—' }
                    ];
                    gridHtml = items.map(item => `
                        <div class="detail-item">
                            <span class="label">${item.label}</span>
                            <span class="value">${item.value}</span>
                        </div>
                    `).join('');
                } else {
                    sectionLabel = 'Details';
                    iconClass = 'fa-regular fa-circle-info';
                    gridHtml = `<div class="detail-item"><span class="label">No additional details available</span></div>`;
                }

                typeLabel.textContent = sectionLabel;
                typeIcon.className = iconClass;
                typeDetailsGrid.innerHTML = gridHtml;

                // ─── Seller Card ────────────────────────────────────────
                const seller = data.seller || {};
                const sellerName = seller.name || 'Anonymous';
                const initials = getInitials(sellerName);
                const avatarUrl = seller.profile_picture || '';
                const isOwner = seller.is_owner || false;

                let sellerBadgesHtml = '';
                if (seller.email_verified) {
                    sellerBadgesHtml += `<span class="badge-pill verified"><i class="fa-regular fa-envelope"></i> Email</span>`;
                }
                if (seller.hall_verified) {
                    sellerBadgesHtml += `<span class="badge-pill verified"><i class="fa-regular fa-building"></i> Hall</span>`;
                }
                if (seller.student_id_verified) {
                    sellerBadgesHtml += `<span class="badge-pill verified"><i class="fa-regular fa-id-card"></i> ID</span>`;
                }
                if (seller.badges && seller.badges.length > 0) {
                    seller.badges.forEach(b => {
                        sellerBadgesHtml += `<span class="badge-pill"><i class="fa-regular fa-medal"></i> ${b}</span>`;
                    });
                }

                const trustScore = seller.trust_score || 0;
                const trustColor = trustScore >= 70 ? 'var(--green)' : (trustScore >= 40 ? '#f39c12' : 'var(--red)');

                sellerCard.innerHTML = `
                    <div class="seller-avatar-lg">
                        ${avatarUrl ? `<img src="${avatarUrl}" alt="${sellerName}" />` : initials}
                    </div>
                    <div class="seller-name">
                        ${sellerName}
                        ${!seller.visibility ? '<span class="privacy-icon" title="This seller has set their profile to private"><i class="fa-regular fa-eye-slash"></i></span>' : ''}
                        ${isOwner ? '<span class="you-tag">You</span>' : ''}
                    </div>
                    <div class="seller-meta">
                        ${seller.department ? `<span><i class="fa-regular fa-graduation-cap"></i> ${seller.department}</span>` : ''}
                        ${seller.level ? `<span><i class="fa-regular fa-layer-group"></i> ${seller.level}L</span>` : ''}
                        ${seller.member_since ? `<span><i class="fa-regular fa-calendar"></i> Since ${seller.member_since}</span>` : ''}
                        ${seller.total_reviews !== undefined ? `<span><i class="fa-regular fa-star"></i> ${seller.total_reviews} reviews</span>` : ''}
                        ${seller.average_rating ? `<span><i class="fa-regular fa-star" style="color:var(--star);"></i> ${seller.average_rating.toFixed(1)}</span>` : ''}
                    </div>
                    ${sellerBadgesHtml ? `<div class="seller-badges">${sellerBadgesHtml}</div>` : ''}
                    <div class="trust-row">
                        <span class="trust-label">Trust Score</span>
                        <div class="trust-bar-track">
                            <div class="trust-bar-fill" style="width:${trustScore}%; background:${trustColor};"></div>
                        </div>
                        <span class="trust-score" style="color:${trustColor};">${trustScore}%</span>
                    </div>
                    <button class="btn-profile" id="viewProfileBtn"><i class="fa-regular fa-user"></i> View Profile</button>
                `;

                // ─── Reviews ─────────────────────────────────────────────
                const reviews = data.reviews || [];
                const reviewCount = data.review_count || 0;
                const avgRating = data.avg_rating || 0;

                let reviewsHtml = '';
                if (reviewCount === 0) {
                    reviewsHtml = `
                        <div class="no-reviews">
                            <i class="fa-regular fa-star"></i>
                            <p>No reviews yet. Be the first to leave a review!</p>
                        </div>
                    `;
                } else {
                    reviewsHtml = reviews.map(rev => {
                        const revInitials = getInitials(rev.from);
                        return `
                            <div class="review-item">
                                <div class="review-head">
                                    <span class="reviewer">
                                        <span class="avatar-sm">${revInitials}</span>
                                        ${rev.from || 'Anonymous'}
                                        <span class="from-label">• ${rev.date || 'Recently'}</span>
                                    </span>
                                    ${renderStars(rev.rating || 0)}
                                </div>
                                <div class="review-comment">“${rev.comment || 'No comment provided.'}”</div>
                                <div class="review-date">${formatDate(rev.date)}</div>
                            </div>
                        `;
                    }).join('');
                }

                reviewSummary.innerHTML = `
                    <div class="big-rating">
                        <span class="rating-number">${avgRating.toFixed(1)}</span>
                        ${renderStars(avgRating, 'lg')}
                    </div>
                    <span class="review-count-text">${reviewCount} review${reviewCount !== 1 ? 's' : ''}</span>
                `;
                reviewsList.innerHTML = reviewsHtml;

                // ─── Show content ────────────────────────────────────────
                loadingEl.style.display = 'none';
                contentEl.style.display = 'block';

                // ─── Event: Contact Seller ──────────────────────────────
                contactSellerBtn.addEventListener('click', function() {
                    if (!seller.id) {
                        showToast('Seller information not available.', 'error');
                        return;
                    }
                    window.location.href = `chat.html?user_id=${seller.id}`;
                });

                // ─── Event: View Profile ──────────────────────────────────
                document.getElementById('viewProfileBtn').addEventListener('click', function() {
                    if (!seller.id) {
                        showToast('Seller information not available.', 'error');
                        return;
                    }
                    window.location.href = `profile.html?user_id=${seller.id}`;
                });

                // ─── Event: Like ──────────────────────────────────────────
                let liked = false;
                likeBtn.addEventListener('click', function() {
                    liked = !liked;
                    this.classList.toggle('active', liked);
                    const icon = this.querySelector('i');
                    icon.className = liked ? 'fa-solid fa-heart' : 'fa-regular fa-heart';
                    showToast(liked ? 'Added to favourites ❤️' : 'Removed from favourites', 'success');
                });
            }

            function showError(message) {
                loadingEl.style.display = 'none';
                errorEl.style.display = 'block';
                const p = errorEl.querySelector('p');
                if (p) p.textContent = message || 'The listing you are looking for does not exist or has been removed.';
            }

            // ─── Init ──────────────────────────────────────────────────
            async function init() {
                const listingId = getListingId();
                if (!listingId) {
                    showError('No listing ID provided.');
                    return;
                }

                try {
                    const data = await fetchListingDetails(listingId);
                    renderListing(data);
                } catch (error) {
                    console.error('Init error:', error);
                    showError(error.message || 'Failed to load listing details.');
                }
            }

            // ─── Run ──────────────────────────────────────────────────
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                setTimeout(init, 100);
            }

            // ─── Expose for debugging ──────────────────────────────────
            window.__listingDetails = {
                getListingId,
                fetchListingDetails,
                renderListing,
            };

        })();
    </script>

</body>
</html>
