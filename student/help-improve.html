<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>CampusHub – Help Us Improve</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- Global Styles -->
    <link rel="stylesheet" href="/assets/css/studentStyle.css" />
    <link rel="icon" type="image/jpeg" href="../assets/img/icon.jpg">

    <style>
        .feedback-wrapper {
            max-width: 640px;
            margin: 0 auto;
        }

        .feedback-card {
            background: var(--bg-card);
            border-radius: var(--radius-card);
            padding: 24px 28px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-card);
            transition: background var(--transition), border-color var(--transition), box-shadow var(--transition);
            margin-bottom: 20px;
        }

        .feedback-card .card-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: color var(--transition);
        }
        .feedback-card .card-title i {
            color: var(--star);
            font-size: 22px;
        }
        .feedback-card .card-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
            transition: color var(--transition);
        }

        .feedback-card .form-group {
            margin-bottom: 18px;
        }
        .feedback-card .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
            transition: color var(--transition);
        }
        .feedback-card .form-group label .required-star {
            color: var(--red);
            margin-left: 2px;
        }

        .feedback-card .form-input,
        .feedback-card .form-textarea,
        .feedback-card .form-select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            transition: all 0.25s ease;
            outline: none;
        }
        .feedback-card .form-input:focus,
        .feedback-card .form-textarea:focus,
        .feedback-card .form-select:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 4px rgba(13, 138, 62, 0.10);
            background: var(--bg-card);
        }
        .feedback-card .form-input.error,
        .feedback-card .form-textarea.error,
        .feedback-card .form-select.error {
            border-color: var(--red);
            box-shadow: 0 0 0 4px rgba(231, 76, 60, 0.10);
        }
        .feedback-card .help-text {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
            transition: color var(--transition);
        }
        .feedback-card .help-text.error {
            color: var(--red);
        }

        .char-counter {
            text-align: right;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
            transition: color var(--transition);
        }
        .char-counter.warning {
            color: #e67e22;
        }
        .char-counter.danger {
            color: var(--red);
        }

        .feedback-actions {
            display: flex;
            gap: 12px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .feedback-actions button {
            flex: 1;
            padding: 12px 0;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 120px;
        }
        .feedback-actions .btn-submit {
            background: var(--green);
            color: #ffffff;
        }
        .feedback-actions .btn-submit:hover {
            opacity: 0.9;
            transform: scale(0.98);
        }
        .feedback-actions .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .feedback-actions .btn-cancel {
            background: var(--bg-input);
            color: var(--text-secondary);
        }
        .feedback-actions .btn-cancel:hover {
            background: var(--border-color);
        }

        .btn-submit .spinner-btn {
            display: none;
        }
        .btn-submit.loading .spinner-btn {
            display: inline-block;
            margin-right: 6px;
        }
        .btn-submit.loading .btn-text {
            display: none;
        }

        @media (max-width: 480px) {
            .feedback-card {
                padding: 16px 18px;
            }
            .feedback-card .card-title {
                font-size: 17px;
            }
            .feedback-actions button {
                min-width: 100px;
                font-size: 13px;
                padding: 10px 0;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- ===== LOCATION ===== -->
        <div class="location-bar">
            <i class="fa-solid fa-location-dot"></i>
            <div class="loc-text">
                University of Benin <span>• Ugbowo</span>
            </div>
        </div>

        <!-- ===== MAIN ===== -->
        <main class="main-content" style="padding-top: 12px;">

            <div class="feedback-wrapper">

                <div class="feedback-card">
                    <div class="card-title">
                        <i class="fa-regular fa-lightbulb"></i> Help Us Improve
                    </div>
                    <div class="card-subtitle">Your feedback makes CampusHub better. Share your suggestions, report bugs, or request features.</div>

                    <form id="feedbackForm" autocomplete="off">

                        <!-- Feedback Type -->
                        <div class="form-group">
                            <label for="feedbackType">Feedback Type <span class="required-star">*</span></label>
                            <div class="form-select-wrap">
                                <select id="feedbackType" class="form-select" required>
                                    <option value="">Select a type...</option>
                                    <option value="suggestion">💡 Suggestion</option>
                                    <option value="bug_report">🐛 Bug Report</option>
                                    <option value="feature_request">🚀 Feature Request</option>
                                    <option value="general">💬 General Feedback</option>
                                </select>
                            </div>
                            <div class="help-text" id="typeHelp"></div>
                        </div>

                        <!-- Subject -->
                        <div class="form-group">
                            <label for="subject">Subject <span class="required-star">*</span></label>
                            <input type="text" id="subject" class="form-input" placeholder="Brief summary of your feedback" required />
                            <div class="help-text" id="subjectHelp"></div>
                        </div>

                        <!-- Description -->
                        <div class="form-group">
                            <label for="description">Description <span class="required-star">*</span></label>
                            <textarea id="description" class="form-textarea" rows="4" placeholder="Please provide detailed feedback..." required></textarea>
                            <div class="char-counter" id="charCounter">0 / 500</div>
                            <div class="help-text" id="descHelp"></div>
                        </div>

                        <!-- Actions -->
                        <div class="feedback-actions">
                            <button type="submit" class="btn-submit" id="submitBtn">
                                <span class="btn-text"><i class="fa-regular fa-paper-plane"></i> Send Feedback</span>
                                <span class="spinner-btn"><i class="fa-solid fa-spinner fa-spin"></i></span>
                            </button>
                            <button type="button" class="btn-cancel" id="cancelBtn">Cancel</button>
                        </div>
                    </form>
                </div>

            </div>

        </main>

        <!-- ===== DEMO NOTE ===== -->
        <div class="demo-note">
            <span>CampusHub</span> • Help Us Improve
        </div>

    </div>

    <!-- ===== SCRIPTS ===== -->
    <script src="/assets/js/studentGlobal.js"></script>
    <script src="/assets/js/modal.js"></script>
    <script src="/assets/js/showAlert.js"></script>

    <script>
        (function() {
            'use strict';

            // ─── DOM refs ──────────────────────────────────────────────
            const form = document.getElementById('feedbackForm');
            const typeSelect = document.getElementById('feedbackType');
            const subjectInput = document.getElementById('subject');
            const descInput = document.getElementById('description');

            const typeHelp = document.getElementById('typeHelp');
            const subjectHelp = document.getElementById('subjectHelp');
            const descHelp = document.getElementById('descHelp');

            const submitBtn = document.getElementById('submitBtn');
            const cancelBtn = document.getElementById('cancelBtn');
            const charCounter = document.getElementById('charCounter');

            const MAX_DESC_LENGTH = 500;

            // ─── Character Counter ─────────────────────────────────────
            descInput.addEventListener('input', function() {
                const length = this.value.length;
                charCounter.textContent = `${length} / ${MAX_DESC_LENGTH}`;
                if (length > MAX_DESC_LENGTH * 0.8 && length <= MAX_DESC_LENGTH) {
                    charCounter.className = 'char-counter warning';
                } else if (length > MAX_DESC_LENGTH) {
                    charCounter.className = 'char-counter danger';
                } else {
                    charCounter.className = 'char-counter';
                }
                validateForm();
            });

            // ─── Helpers ──────────────────────────────────────────────
            function clearFieldHelp(el) {
                el.textContent = '';
                el.className = 'help-text';
            }

            function setFieldHelp(el, message) {
                el.textContent = message;
                el.className = 'help-text error';
            }

            // ─── Validation ────────────────────────────────────────────
            function validateForm() {
                let isValid = true;

                if (!typeSelect.value) {
                    setFieldHelp(typeHelp, 'Please select a feedback type.');
                    isValid = false;
                } else {
                    clearFieldHelp(typeHelp);
                }

                const subject = subjectInput.value.trim();
                if (!subject) {
                    setFieldHelp(subjectHelp, 'Please enter a subject.');
                    isValid = false;
                } else if (subject.length < 3) {
                    setFieldHelp(subjectHelp, 'Subject must be at least 3 characters.');
                    isValid = false;
                } else {
                    clearFieldHelp(subjectHelp);
                }

                const desc = descInput.value;
                if (!desc.trim()) {
                    setFieldHelp(descHelp, 'Please enter a description.');
                    isValid = false;
                } else if (desc.length > MAX_DESC_LENGTH) {
                    setFieldHelp(descHelp, `Description is too long (max ${MAX_DESC_LENGTH} characters).`);
                    isValid = false;
                } else {
                    clearFieldHelp(descHelp);
                }

                submitBtn.disabled = !isValid;
                return isValid;
            }

            // ─── Input events ──────────────────────────────────────────
            typeSelect.addEventListener('change', validateForm);
            subjectInput.addEventListener('input', validateForm);
            descInput.addEventListener('input', validateForm);

            // ─── Submit ─────────────────────────────────────────────────
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                if (!validateForm()) return;

                const feedbackType = typeSelect.value;
                const subject = subjectInput.value.trim();
                const description = descInput.value.trim();

                // Build the message with the type prefix
                const typeLabel = typeSelect.options[typeSelect.selectedIndex]?.text || feedbackType;
                const fullMessage = `[${typeLabel}]\nSubject: ${subject}\n\n${description}`;

                // Get authenticated user data
                const user = window.getUserData ? window.getUserData() : null;
                const reporterName = user ? (user.first_name + ' ' + user.last_name).trim() || user.username : '';
                const reporterEmail = user ? user.email : '';

                const payload = {
                    issue_type: 'Improve',
                    listing_identifier: '',
                    reported_user_identifer: '',
                    message: fullMessage,
                    reporter_name: reporterName,
                    reporter_email: reporterEmail
                };

                // ─── Confirm submission ──────────────────────────────
                const doSubmit = async () => {
                    submitBtn.disabled = true;
                    submitBtn.classList.add('loading');

                    try {
                        const response = await window.fetchWithAuth(
                            `${USER_URL}report/submit`,
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(payload)
                            }
                        );

                        const result = await response.json();
                        if (result.status_code === 201 || result.is_success) {
                            if (typeof showAlert !== 'undefined') {
                                showAlert.success(result.message || 'Thank you for your feedback! 🎉');
                            } else {
                                alert(result.message || 'Thank you for your feedback!');
                            }
                            // Reset form
                            form.reset();
                            charCounter.textContent = `0 / ${MAX_DESC_LENGTH}`;
                            charCounter.className = 'char-counter';
                            clearFieldHelp(typeHelp);
                            clearFieldHelp(subjectHelp);
                            clearFieldHelp(descHelp);
                            submitBtn.disabled = true;
                        } else {
                            const errorMsg = result.message || 'Failed to submit feedback. Please try again.';
                            if (typeof showAlert !== 'undefined') {
                                showAlert.error(errorMsg);
                            } else {
                                alert(errorMsg);
                            }
                        }
                    } catch (error) {
                        console.error('Feedback submission error:', error);
                        if (typeof showAlert !== 'undefined') {
                            showAlert.error('Network error. Please check your connection.');
                        } else {
                            alert('Network error. Please check your connection.');
                        }
                    } finally {
                        submitBtn.classList.remove('loading');
                        submitBtn.disabled = false;
                    }
                };

                if (typeof Modal !== 'undefined') {
                    const modal = new Modal({
                        title: 'Submit Feedback?',
                        body: `
                            <p>You are about to submit feedback of type <strong>${typeLabel}</strong>.</p>
                            <p style="color:var(--text-muted); font-size:13px;"><strong>Subject:</strong> ${subject}</p>
                            <p style="color:var(--text-muted); font-size:13px;">Thank you for helping us improve CampusHub!</p>
                        `,
                        type: 'info',
                        confirmText: 'Submit',
                        cancelText: 'Cancel',
                        onConfirm: doSubmit
                    });
                    modal.open();
                } else {
                    if (confirm('Submit this feedback?')) {
                        doSubmit();
                    }
                }
            });

            // ─── Cancel ─────────────────────────────────────────────────
            cancelBtn.addEventListener('click', function() {
                if (typeof showToast !== 'undefined') {
                    showToast('Feedback discarded.', 'success');
                }
                form.reset();
                charCounter.textContent = `0 / ${MAX_DESC_LENGTH}`;
                charCounter.className = 'char-counter';
                clearFieldHelp(typeHelp);
                clearFieldHelp(subjectHelp);
                clearFieldHelp(descHelp);
                submitBtn.disabled = true;
            });

            // ─── Init ──────────────────────────────────────────────────
            setTimeout(validateForm, 100);
            console.log('📟 Help us improve page initialized.');

        })();
    </script>

</body>
</html>
