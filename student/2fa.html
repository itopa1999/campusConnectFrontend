<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>CampusHub – Two-Factor Authentication</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- Global Styles -->
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="icon" type="image/jpeg" href="../assets/img/icon.jpg">

    <!-- Page-Specific Styles -->
    <style>
        .mfa-wrapper {
            max-width: 800px;
            margin: 0 auto;
        }

        .mfa-card {
            background: var(--bg-card);
            border-radius: var(--radius-card);
            padding: 24px 28px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-card);
            transition: background var(--transition), border-color var(--transition), box-shadow var(--transition);
            margin-bottom: 20px;
        }

        .mfa-card .card-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: color var(--transition);
        }
        .mfa-card .card-title i {
            color: var(--green);
            font-size: 22px;
        }
        .mfa-card .card-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
            transition: color var(--transition);
        }

        .methods-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }

        .method-card {
            background: var(--bg-input);
            border-radius: 14px;
            padding: 18px 20px 20px;
            border: 2px solid transparent;
            transition: all var(--transition);
            cursor: default;
            position: relative;
        }
        .method-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-card-hover);
            background: var(--bg-card);
            border-color: var(--border-color);
        }
        .method-card .method-icon {
            font-size: 28px;
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--green-bg);
            color: var(--green);
            margin-bottom: 10px;
            transition: background var(--transition), color var(--transition);
        }
        .method-card .method-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 2px;
            transition: color var(--transition);
        }
        .method-card .method-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
            margin-bottom: 12px;
            transition: color var(--transition);
        }
        .method-card .method-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            padding: 3px 14px;
            border-radius: 30px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            transition: background var(--transition), color var(--transition), border-color var(--transition);
        }
        .method-card .method-status .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .method-card .method-status .status-dot.enabled {
            background: var(--green);
        }
        .method-card .method-status .status-dot.disabled {
            background: var(--text-muted);
        }

        .method-card .method-action {
            margin-top: 12px;
            width: 100%;
            padding: 8px 0;
            border: none;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .method-card .method-action.enable {
            background: var(--green);
            color: #fff;
        }
        .method-card .method-action.enable:hover {
            opacity: 0.9;
            transform: scale(0.97);
        }
        .method-card .method-action.disable {
            background: var(--bg-input);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        .method-card .method-action.disable:hover {
            background: var(--border-color);
        }
        .method-card .method-action:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .method-card.active {
            border-color: var(--green);
            background: var(--green-bg);
            box-shadow: 0 0 0 3px rgba(13, 138, 62, 0.08);
        }
        .method-card.active .method-icon {
            background: var(--bg-card);
            color: var(--green);
        }
        .method-card.active .method-status {
            border-color: var(--green);
            background: var(--bg-card);
            color: var(--green);
        }
        .method-card.active .method-status .status-dot {
            background: var(--green);
        }

        .dark-mode .method-card.active {
            background: rgba(46, 204, 113, 0.06);
            border-color: #2ecc71;
            box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.08);
        }
        .dark-mode .method-card.active .method-status {
            border-color: #2ecc71;
            background: var(--bg-card);
            color: #2ecc71;
        }

        .method-card .active-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--green);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* ─── QR Modal Specific ─── */
        .qr-modal-body {
            text-align: center;
        }
        .qr-modal-body .qr-image {
            max-width: 200px;
            border-radius: 12px;
            margin: 12px auto 16px;
            display: block;
            background: #fff;
            padding: 8px;
        }
        .qr-modal-body .qr-input-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .qr-modal-body .qr-input-group input {
            width: 160px;
            padding: 10px 14px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 16px;
            text-align: center;
            letter-spacing: 4px;
            font-weight: 600;
            transition: border-color 0.2s;
        }
        .qr-modal-body .qr-input-group input:focus {
            border-color: var(--green);
            outline: none;
        }
        .qr-modal-body .qr-input-group button {
            padding: 10px 28px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            background: var(--green);
            color: #fff;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .qr-modal-body .qr-input-group button:hover {
            opacity: 0.9;
        }
        .qr-modal-body .qr-secret {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 12px;
        }
        .qr-modal-body .qr-secret code {
            background: var(--bg-input);
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
            color: var(--text-primary);
            cursor: pointer;
            user-select: all;
        }

        /* ─── Loading ─── */
        .mfa-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 0;
            gap: 12px;
        }
        .mfa-loading .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-color);
            border-top-color: var(--green);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .mfa-loading p {
            font-size: 14px;
            color: var(--text-muted);
        }

        @media (max-width: 480px) {
            .mfa-card {
                padding: 16px 18px;
            }
            .mfa-card .card-title {
                font-size: 17px;
            }
            .methods-grid {
                grid-template-columns: 1fr;
            }
            .method-card {
                padding: 14px 16px 16px;
            }
            .qr-modal-body .qr-input-group {
                flex-direction: column;
                align-items: center;
            }
            .qr-modal-body .qr-input-group input {
                width: 100%;
                max-width: 200px;
            }
        }

        .demo-note {
            text-align: center;
            font-size: 10px;
            color: var(--text-muted);
            padding: 8px 0 4px;
            letter-spacing: 0.3px;
            background: var(--bg-app);
            border-top: 1px solid var(--border-color);
            transition: background var(--transition), color var(--transition), border-color var(--transition);
        }
        .demo-note span {
            font-weight: 600;
            color: var(--green);
            transition: color var(--transition);
        }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- ===== HEADER (injected by global.js) ===== -->

        <!-- ===== LOCATION ===== -->
        <div class="location-bar">
            <i class="fa-solid fa-location-dot"></i>
            <div class="loc-text">
                University of Benin <span>• Ugbowo</span>
            </div>
        </div>

        <!-- ===== MAIN ===== -->
        <main class="main-content" style="padding-top: 12px;">

            <div class="mfa-wrapper">

                <div class="mfa-card" id="mfaCard">
                    <div class="card-title">
                        <i class="fa-regular fa-shield-halved"></i> Two-Factor Authentication
                    </div>
                    <div class="card-subtitle">Choose a method to secure your account with 2FA</div>

                    <!-- Loading state -->
                    <div id="mfaLoadingState" class="mfa-loading">
                        <div class="spinner"></div>
                        <p>Loading security methods…</p>
                    </div>

                    <!-- Content -->
                    <div id="mfaContent" style="display:none;">
                        <div class="methods-grid" id="methodsGrid">
                            <!-- Populated by JS -->
                        </div>
                    </div>
                </div>

            </div>

        </main>

        <!-- ===== DEMO NOTE ===== -->
        <div class="demo-note">
            <span>CampusHub</span> • Two-Factor Authentication • real API
        </div>

    </div>

    <!-- ===== SCRIPTS ===== -->
    <script src="/assets/js/global.js"></script>
    <script src="/assets/js/modal.js"></script>
    <script src="/assets/js/showAlert.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

    <script>
        (function() {
            'use strict';

            const loadingState = document.getElementById('mfaLoadingState');
            const content = document.getElementById('mfaContent');
            const methodsGrid = document.getElementById('methodsGrid');

            // ─── API Endpoints ──────────────────────────────────────────
            const METHODS_API = `${AUTH_URL}2fa/methods`;
            const TOGGLE_API = `${AUTH_URL}2fa/toggle`;
            const VERIFY_TOTP_API = `${AUTH_URL}2fa/verify-totp`;

            // ─── Fetch methods ──────────────────────────────────────────
            async function fetchMethods() {
                const response = await fetchWithAuth(METHODS_API, {
                    method: 'GET',
                    showSpinner: true,
                    spinnerText: 'Loading 2FA...'
                });
                if (!response.ok) {
                    const err = await response.json().catch(() => ({}));
                    throw new Error(err.message || `HTTP ${response.status}`);
                }
                const result = await response.json();
                if (!result.is_success) {
                    throw new Error(result.message || 'Failed to load 2FA methods');
                }
                return result.data;
            }

            // ─── Toggle method ──────────────────────────────────────────
            async function toggleMethod(value) {
                const response = await fetchWithAuth(TOGGLE_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ two_factor_Type: value }),
                });
                if (!response.ok) {
                    const err = await response.json().catch(() => ({}));
                    throw new Error(err.message || `HTTP ${response.status}`);
                }
                const result = await response.json();
                if (!result.is_success) {
                    throw new Error(result.message || 'Toggle failed');
                }
                return result.data;
            }

            // ─── Verify TOTP ────────────────────────────────────────────
            async function verifyTotp(code) {
                const response = await fetchWithAuth(VERIFY_TOTP_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code }),
                });
                if (!response.ok) {
                    const err = await response.json().catch(() => ({}));
                    throw new Error(err.message || `HTTP ${response.status}`);
                }
                const result = await response.json();
                if (!result.is_success) {
                    throw new Error(result.message || 'Verification failed');
                }
                return result.data; // contains backup_codes
            }

            // ─── Render methods ─────────────────────────────────────────
            function renderMethods(data) {
                const methods = data.methods || [];
                loadingState.style.display = 'none';
                content.style.display = 'block';

                if (methods.length === 0) {
                    methodsGrid.innerHTML = `
                        <div style="grid-column:1/-1; text-align:center; padding:40px 20px; color:var(--text-muted);">
                            <span style="font-size:48px; display:block; margin-bottom:12px;">🔐</span>
                            <h3 style="color:var(--text-primary);">No 2FA methods available</h3>
                            <p>Please check back later.</p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                methods.forEach(method => {
                    const isEnabled = method.is_enabled || false;
                    const canEnable = method.can_enable !== undefined ? method.can_enable : true;
                    const cardClass = isEnabled ? 'method-card active' : 'method-card';
                    const statusText = isEnabled ? 'Enabled' : 'Disabled';
                    const statusDotClass = isEnabled ? 'enabled' : 'disabled';
                    const actionClass = isEnabled ? 'disable' : 'enable';
                    const actionText = isEnabled ? 'Disable' : 'Enable';
                    const disabledAttr = (!canEnable && !isEnabled) ? 'disabled' : '';

                    html += `
                        <div class="${cardClass}" data-value="${method.value}">
                            ${isEnabled ? '<span class="active-badge"><i class="fa-regular fa-circle-check"></i> Active</span>' : ''}
                            <div class="method-icon"><i class="${method.icon}"></i></div>
                            <div class="method-name">${method.name}</div>
                            <div class="method-desc">${method.description}</div>
                            <div class="method-status">
                                <span class="status-dot ${statusDotClass}"></span>
                                ${statusText}
                            </div>
                            <button class="method-action ${actionClass}" data-value="${method.value}" data-action="${isEnabled ? 'disable' : 'enable'}" ${disabledAttr}>
                                ${actionText} ${method.name.split(' ')[0]}
                            </button>
                        </div>
                    `;
                });

                methodsGrid.innerHTML = html;

                methodsGrid.querySelectorAll('.method-action').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const value = this.dataset.value;
                        const action = this.dataset.action;
                        handleMethodAction(value, action, this);
                    });
                });
            }

            // ─── Handle method action ──────────────────────────────────
            function handleMethodAction(value, action, btnElement) {
                const methodName = btnElement.closest('.method-card').querySelector('.method-name').textContent;

                if (action === 'disable') {
                    const doDisable = async () => {
                        btnElement.disabled = true;
                        btnElement.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
                        try {
                            await toggleMethod(value);
                            const data = await fetchMethods();
                            renderMethods(data);
                            if (typeof showAlert !== 'undefined') {
                                showAlert.success(`${methodName} disabled.`, { duration: 2000 });
                            }
                        } catch (err) {
                            console.error(err);
                            if (typeof showAlert !== 'undefined') {
                                showAlert.error(err.message || 'Failed to disable method.');
                            }
                            btnElement.disabled = false;
                            btnElement.innerHTML = 'Disable';
                        }
                    };

                    if (typeof Modal !== 'undefined') {
                        const modal = new Modal({
                            title: 'Disable 2FA Method',
                            body: `
                                <p>Are you sure you want to disable <strong>${methodName}</strong>?</p>
                                <p style="color:var(--text-muted); font-size:13px;">Your account will be less secure without this method.</p>
                            `,
                            type: 'warning',
                            confirmText: 'Disable',
                            cancelText: 'Cancel',
                            onConfirm: doDisable
                        });
                        modal.open();
                    } else {
                        if (confirm(`Disable ${methodName}?`)) {
                            doDisable();
                        }
                    }
                    return;
                }

                if (action === 'enable') {
                    const doEnable = async () => {
                        btnElement.disabled = true;
                        btnElement.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
                        try {
                            const toggleResult = await toggleMethod(value);
                            if (toggleResult && toggleResult.qr_code) {
                                showTotpModal(toggleResult, value);
                            } else {
                                const data = await fetchMethods();
                                renderMethods(data);
                                if (typeof showAlert !== 'undefined') {
                                    showAlert.success(`${methodName} enabled.`, { duration: 2000 });
                                }
                            }
                        } catch (err) {
                            console.error(err);
                            if (typeof showAlert !== 'undefined') {
                                showAlert.error(err.message || 'Failed to enable method.');
                            }
                            btnElement.disabled = false;
                            btnElement.innerHTML = 'Enable';
                        } finally {
                            if (!btnElement.closest('.modal')) {
                                btnElement.disabled = false;
                                btnElement.innerHTML = 'Enable';
                            }
                        }
                    };

                    if (typeof Modal !== 'undefined') {
                        const modal = new Modal({
                            title: 'Enable 2FA Method',
                            body: `
                                <p>Enable <strong>${methodName}</strong> for your account?</p>
                                <p style="color:var(--text-muted); font-size:13px;">This will add an extra layer of security to your account.</p>
                            `,
                            type: 'success',
                            confirmText: 'Enable',
                            cancelText: 'Cancel',
                            onConfirm: doEnable
                        });
                        modal.open();
                    } else {
                        if (confirm(`Enable ${methodName}?`)) {
                            doEnable();
                        }
                    }
                }
            }

            // ─── TOTP QR Modal ──────────────────────────────────────────
            function showTotpModal(totpData, value) {
                const { secret, qr_code, provisioning_uri } = totpData;

                const modal = new Modal({
                    title: 'Set Up Authenticator App',
                    type: 'info',
                    size: 'md',
                    showCancel: true,
                    cancelText: 'Cancel',
                    confirmText: 'Verify',
                    onConfirm: null,
                    body: `
                        <div class="qr-modal-body">
                            <p>Scan the QR code with your authenticator app (Google Authenticator, Authy, etc.)</p>
                            <img src="${qr_code}" alt="QR Code" class="qr-image" />
                            <div class="qr-secret">
                                <span>Or enter this secret manually:</span>
                                <code>${secret}</code>
                                <span style="display:block; font-size:12px; margin-top:4px;">(click the code to select all)</span>
                            </div>
                            <div class="qr-input-group">
                                <input type="text" id="totpCodeInput" placeholder="Enter 6-digit code" maxlength="6" inputmode="numeric" autocomplete="off" />
                                <button id="verifyTotpBtn">Verify</button>
                            </div>
                            <div id="totpVerifyError" style="color:var(--red); font-size:13px; margin-top:8px; display:none;"></div>
                        </div>
                    `,
                    onOpen: function(modalInstance) {
                        const input = modalInstance._element.querySelector('#totpCodeInput');
                        if (input) {
                            input.focus();
                            input.addEventListener('input', function() {
                                this.value = this.value.replace(/\D/g, '').slice(0, 6);
                            });
                        }
                    },
                    onClose: function() {
                        const btn = document.querySelector('.method-action[data-value="totp"][data-action="enable"]');
                        if (btn) {
                            btn.disabled = false;
                            btn.innerHTML = 'Enable Authenticator';
                        }
                        fetchMethods().then(data => renderMethods(data)).catch(console.error);
                    }
                });

                const footer = modal._element.querySelector('.modal-footer');
                if (footer) {
                    footer.innerHTML = `
                        <button class="modal-cancel-btn btn-reset" style="padding:10px 24px; border-radius:30px; font-size:14px; font-weight:600; border:none; cursor:pointer; background:var(--bg-input); color:var(--text-secondary);">Cancel</button>
                        <button id="verifyTotpFooterBtn" style="padding:10px 24px; border-radius:30px; font-size:14px; font-weight:600; border:none; cursor:pointer; background:var(--green); color:#fff;">Verify</button>
                    `;
                    const cancelBtn = footer.querySelector('.modal-cancel-btn');
                    if (cancelBtn) {
                        cancelBtn.addEventListener('click', () => modal.close());
                    }
                    const verifyFooterBtn = footer.querySelector('#verifyTotpFooterBtn');
                    const verifyBodyBtn = modal._element.querySelector('#verifyTotpBtn');
                    const input = modal._element.querySelector('#totpCodeInput');
                    const errorEl = modal._element.querySelector('#totpVerifyError');

                    const verifyAction = async () => {
                        const code = input.value.trim();
                        if (!code || code.length !== 6) {
                            errorEl.textContent = 'Please enter a valid 6-digit code.';
                            errorEl.style.display = 'block';
                            return;
                        }
                        errorEl.style.display = 'none';
                        verifyFooterBtn.disabled = true;
                        verifyFooterBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
                        verifyBodyBtn.disabled = true;
                        verifyBodyBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

                        try {
                            const data = await verifyTotp(code);
                            // Close QR modal
                            modal.close();
                            // Show backup codes modal
                            if (data && data.backup_codes && data.backup_codes.length > 0) {
                                showBackupCodesModal(data.backup_codes);
                            } else {
                                // No backup codes – just refresh
                                const methods = await fetchMethods();
                                renderMethods(methods);
                                if (typeof showAlert !== 'undefined') {
                                    showAlert.success('TOTP enabled successfully!', { duration: 3000 });
                                }
                            }
                        } catch (err) {
                            errorEl.textContent = err.message || 'Invalid code. Please try again.';
                            errorEl.style.display = 'block';
                            verifyFooterBtn.disabled = false;
                            verifyFooterBtn.innerHTML = 'Verify';
                            verifyBodyBtn.disabled = false;
                            verifyBodyBtn.innerHTML = 'Verify';
                        }
                    };

                    [verifyFooterBtn, verifyBodyBtn].forEach(btn => {
                        if (btn) {
                            btn.addEventListener('click', verifyAction);
                        }
                    });
                    if (input) {
                        input.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter') {
                                e.preventDefault();
                                verifyAction();
                            }
                        });
                    }
                }

                modal.open();
            }

            // ─── Backup Codes Modal ──────────────────────────────────────
            function showBackupCodesModal(codes) {
                if (typeof Modal === 'undefined') return;
                if (typeof window.jspdf === 'undefined') {
                    // Fallback: just show codes without PDF
                    const modal = new Modal({
                        title: 'Backup Codes',
                        type: 'warning',
                        size: 'md',
                        showConfirm: false,
                        showCancel: false,
                        body: `
                            <div style="text-align:center;">
                                <p><strong>Save these backup codes!</strong> They are shown only once.</p>
                                <p style="font-size:13px; color:var(--text-muted);">Use them to log in if you lose your authenticator app.</p>
                                <ul style="list-style:none; padding:0; margin:16px 0; display:flex; flex-direction:column; gap:6px; align-items:center;">
                                    ${codes.map(code => `<li style="background:var(--bg-input); padding:6px 16px; border-radius:30px; font-family:monospace; font-weight:600; font-size:16px; letter-spacing:2px;">${code}</li>`).join('')}
                                </ul>
                                <button id="downloadBackupTxt" style="padding:8px 24px; border-radius:30px; border:none; background:var(--green); color:#fff; font-weight:600; cursor:pointer;">Download as Text</button>
                                <div style="margin-top:12px;">
                                    <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-secondary); justify-content:center;">
                                        <input type="checkbox" id="backupAck" /> I have saved these codes
                                    </label>
                                    <button id="closeBackupBtn" disabled style="margin-top:12px; padding:10px 30px; border-radius:30px; border:none; background:var(--green); color:#fff; font-weight:600; cursor:pointer; opacity:0.5;">Continue</button>
                                </div>
                            </div>
                        `,
                        onOpen: function(modalInstance) {
                            const container = modalInstance._element;
                            const ack = container.querySelector('#backupAck');
                            const closeBtn = container.querySelector('#closeBackupBtn');
                            const downloadBtn = container.querySelector('#downloadBackupTxt');

                            // Enable close only when checked
                            ack.addEventListener('change', function() {
                                closeBtn.disabled = !this.checked;
                                closeBtn.style.opacity = this.checked ? '1' : '0.5';
                            });

                            // Download as text
                            downloadBtn.addEventListener('click', function() {
                                const text = codes.join('\n');
                                const blob = new Blob(['CampusHub Backup Codes\n' + '='.repeat(30) + '\n' + text + '\n' + '='.repeat(30) + '\nStore these safely. One-time use only.'], { type: 'text/plain' });
                                const url = URL.createObjectURL(blob);
                                const a = document.createElement('a');
                                a.href = url;
                                a.download = 'backup_codes.txt';
                                document.body.appendChild(a);
                                a.click();
                                document.body.removeChild(a);
                                URL.revokeObjectURL(url);
                            });

                            // Close & refresh
                            closeBtn.addEventListener('click', function() {
                                modalInstance.close();
                                // Refresh methods
                                fetchMethods().then(data => renderMethods(data)).catch(console.error);
                                if (typeof showAlert !== 'undefined') {
                                    showAlert.success('TOTP enabled and backup codes saved!', { duration: 3000 });
                                }
                            });
                        }
                    });
                    modal.open();
                    return;
                }

                // ─── With jsPDF ──────────────────────────────────────────────
                const { jsPDF } = window.jspdf;
                const modal = new Modal({
                    title: 'Backup Codes',
                    type: 'warning',
                    size: 'md',
                    showConfirm: false,
                    showCancel: false,
                    body: `
                        <div style="text-align:center;">
                            <p><strong>Save these backup codes!</strong> They are shown only once.</p>
                            <p style="font-size:13px; color:var(--text-muted);">Use them to log in if you lose your authenticator app.</p>
                            <ul style="list-style:none; padding:0; margin:16px 0; display:flex; flex-direction:column; gap:6px; align-items:center;">
                                ${codes.map(code => `<li style="background:var(--bg-input); padding:6px 16px; border-radius:30px; font-family:monospace; font-weight:600; font-size:16px; letter-spacing:2px;">${code}</li>`).join('')}
                            </ul>
                            <button id="downloadBackupPdf" style="padding:8px 24px; border-radius:30px; border:none; background:var(--green); color:#fff; font-weight:600; cursor:pointer;"><i class="fa-regular fa-file-pdf"></i> Download PDF</button>
                            <div style="margin-top:12px;">
                                <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-secondary); justify-content:center;">
                                    <input type="checkbox" id="backupAck" /> I have saved these codes
                                </label>
                                <button id="closeBackupBtn" disabled style="margin-top:12px; padding:10px 30px; border-radius:30px; border:none; background:var(--green); color:#fff; font-weight:600; cursor:pointer; opacity:0.5;">I have saved them</button>
                            </div>
                        </div>
                    `,
                    onOpen: function(modalInstance) {
                        const container = modalInstance._element;
                        const ack = container.querySelector('#backupAck');
                        const closeBtn = container.querySelector('#closeBackupBtn');
                        const downloadBtn = container.querySelector('#downloadBackupPdf');

                        ack.addEventListener('change', function() {
                            closeBtn.disabled = !this.checked;
                            closeBtn.style.opacity = this.checked ? '1' : '0.5';
                        });

                        // Generate PDF
                        downloadBtn.addEventListener('click', function() {
                            const doc = new jsPDF();
                            doc.setFontSize(16);
                            doc.text('CampusHub Backup Codes', 14, 22);
                            doc.setFontSize(12);
                            doc.text('Store these codes safely. One-time use only.', 14, 32);
                            const tableData = codes.map((code, i) => [i+1, code]);
                            doc.autoTable({
                                head: [['#', 'Code']],
                                body: tableData,
                                startY: 40,
                                theme: 'striped',
                                headStyles: { fillColor: [46, 204, 113] },
                                margin: { left: 14, right: 14 },
                            });
                            doc.save('backup_codes.pdf');
                        });

                        closeBtn.addEventListener('click', function() {
                            modalInstance.close();
                            fetchMethods().then(data => renderMethods(data)).catch(console.error);
                            if (typeof showAlert !== 'undefined') {
                                showAlert.success('TOTP enabled and backup codes saved!', { duration: 3000 });
                            }
                        });
                    }
                });
                modal.open();
            }

            // ─── Init ──────────────────────────────────────────────────
            async function init() {
                try {
                    const data = await fetchMethods();
                    renderMethods(data);
                } catch (err) {
                    loadingState.innerHTML = `
                        <p style="color:var(--red);">❌ ${err.message || 'Failed to load 2FA methods. Please refresh.'}</p>
                    `;
                    if (typeof showAlert !== 'undefined') {
                        showAlert.error(err.message || 'Failed to load 2FA methods.');
                    }
                    console.error(err);
                }

                console.log('📟 2FA page initialized.');
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                setTimeout(init, 200);
            }

        })();
</script>

</body>
</html>
