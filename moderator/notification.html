<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>CampusHub – Notifications</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- Global Styles -->
    <link rel="stylesheet" href="/assets/css/style.css" />

    <!-- Page-Specific Styles -->
    <style>
        /* ============================================================
           NOTIFICATIONS PAGE SPECIFIC STYLES
           ============================================================ */

        /* ─── Page Header ─── */
        .notif-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px 16px;
            margin-bottom: 20px;
            padding: 16px 20px;
            background: var(--bg-card);
            border-radius: var(--radius-card);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-card);
            transition: background var(--transition), border-color var(--transition), box-shadow var(--transition);
        }
        .notif-header .notif-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .notif-header .notif-title h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            transition: color var(--transition);
            letter-spacing: -0.3px;
        }
        .notif-header .notif-title .bell-icon {
            font-size: 22px;
            color: var(--green);
            background: var(--green-bg);
            padding: 8px 10px;
            border-radius: 14px;
            transition: background var(--transition);
        }
        .notif-header .notif-badge {
            background: var(--red);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            padding: 4px 16px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background var(--transition);
            cursor: default;
        }
        .notif-header .notif-badge i {
            font-size: 14px;
        }
        .notif-header .notif-badge span {
            min-width: 20px;
            text-align: center;
        }

        /* ─── Filter Tabs ─── */
        .notif-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            padding: 4px;
            background: var(--bg-input);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            transition: background var(--transition), border-color var(--transition);
            overflow-x: auto;
            flex-wrap: nowrap;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .notif-tabs::-webkit-scrollbar {
            display: none;
        }
        .notif-tabs .tab-btn {
            flex: 1;
            padding: 10px 16px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
            min-width: fit-content;
        }
        .notif-tabs .tab-btn i {
            font-size: 15px;
            transition: transform 0.3s ease;
        }
        .notif-tabs .tab-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.5);
        }
        .notif-tabs .tab-btn.active {
            background: var(--bg-card);
            color: var(--green);
            box-shadow: 0 4px 16px rgba(13, 138, 62, 0.15);
            transform: scale(1.02);
        }
        .notif-tabs .tab-btn.active i {
            transform: scale(1.1);
        }
        .notif-tabs .tab-btn .tab-badge {
            background: var(--green);
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            padding: 1px 8px;
            border-radius: 20px;
            margin-left: 4px;
        }
        .notif-tabs .tab-btn .tab-badge.unread-badge {
            background: var(--red);
        }
        .dark-mode .notif-tabs {
            background: var(--bg-input);
            border-color: var(--border-color);
        }
        .dark-mode .notif-tabs .tab-btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .dark-mode .notif-tabs .tab-btn.active {
            background: var(--bg-card);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }
        @media (max-width: 480px) {
            .notif-tabs .tab-btn {
                font-size: 11px;
                padding: 8px 12px;
                gap: 5px;
            }
            .notif-tabs .tab-btn i {
                font-size: 13px;
            }
        }

        /* ─── Action Bar ─── */
        .notif-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .notif-actions .action-btn {
            padding: 8px 18px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .notif-actions .action-btn:hover {
            border-color: var(--green);
            color: var(--green);
            background: var(--green-bg);
        }
        .notif-actions .action-btn.danger:hover {
            border-color: var(--red);
            color: var(--red);
            background: rgba(231, 76, 60, 0.08);
        }
        .notif-actions .action-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            pointer-events: none;
        }
        .notif-actions .action-btn i {
            font-size: 13px;
        }
        .notif-actions .action-spacer {
            flex: 1;
        }
        .notif-actions .result-count {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
            transition: color var(--transition);
        }

        /* ─── Notification Cards ─── */
        .notif-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
            transition: opacity 0.3s ease;
        }
        .notif-list.loading {
            opacity: 0.5;
        }

        .notif-card {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 14px 18px;
            background: var(--bg-card);
            border-radius: var(--radius-card);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-card);
            transition: all var(--transition);
            cursor: pointer;
            position: relative;
        }
        .notif-card:hover {
            box-shadow: var(--shadow-card-hover);
            transform: translateX(3px);
        }
        .notif-card.unread {
            border-left: 4px solid var(--green);
            background: var(--green-bg);
        }
        .dark-mode .notif-card.unread {
            background: rgba(46, 204, 113, 0.06);
        }
        .notif-card .notif-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            background: var(--bg-input);
            color: var(--text-muted2);
            transition: background var(--transition), color var(--transition);
        }
        .notif-card .notif-icon.listing {
            background: var(--green-bg);
            color: var(--green);
        }
        .notif-card .notif-icon.account {
            background: #e8f0fe;
            color: #2980b9;
        }
        .notif-card .notif-icon.system {
            background: #fef3e8;
            color: #e67e22;
        }
        .notif-card .notif-icon.transaction {
            background: #f0ebff;
            color: #8e44ad;
        }
        .notif-card .notif-icon.others {
            background: var(--bg-input);
            color: var(--text-muted2);
        }
        .dark-mode .notif-card .notif-icon.listing {
            background: #1a3a2a;
            color: #2ecc71;
        }
        .dark-mode .notif-card .notif-icon.account {
            background: #1a2a3a;
            color: #3498db;
        }
        .dark-mode .notif-card .notif-icon.system {
            background: #3a2a1a;
            color: #f39c12;
        }
        .dark-mode .notif-card .notif-icon.transaction {
            background: #2a1a3a;
            color: #a569bd;
        }
        .dark-mode .notif-card .notif-icon.others {
            background: var(--bg-input);
            color: var(--text-muted2);
        }

        .notif-card .notif-body {
            flex: 1;
            min-width: 0;
        }
        .notif-card .notif-body .notif-title-text {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            transition: color var(--transition);
            margin-bottom: 2px;
        }
        .notif-card .notif-body .notif-message {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
            transition: color var(--transition);
            word-break: break-word;
        }
        .notif-card .notif-body .notif-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 6px;
            font-size: 11px;
            color: var(--text-muted);
            flex-wrap: wrap;
            transition: color var(--transition);
        }
        .notif-card .notif-body .notif-meta .time {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .notif-card .notif-body .notif-meta .time i {
            font-size: 10px;
        }
        .notif-card .notif-body .notif-meta .read-badge {
            font-size: 9px;
            font-weight: 700;
            padding: 1px 10px;
            border-radius: 20px;
            background: var(--bg-input);
            color: var(--text-muted2);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            transition: background var(--transition), color var(--transition);
        }
        .notif-card .notif-body .notif-meta .read-badge.unread-badge {
            background: var(--green-bg);
            color: var(--green);
        }
        .dark-mode .notif-card .notif-body .notif-meta .read-badge.unread-badge {
            background: #1a3a2a;
            color: #2ecc71;
        }

        .notif-card .notif-actions-right {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
            align-items: center;
        }
        .notif-card .notif-actions-right button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 15px;
            padding: 4px 6px;
            border-radius: 8px;
            transition: all 0.2s;
            line-height: 1;
            position: relative;
            z-index: 2;
        }
        .notif-card .notif-actions-right button:hover {
            background: var(--bg-input);
            color: var(--text-primary);
        }
        .notif-card .notif-actions-right .mark-read-btn:hover {
            color: var(--green);
            background: var(--green-bg);
        }
        .notif-card .notif-actions-right .delete-btn:hover {
            color: var(--red);
            background: rgba(231, 76, 60, 0.08);
        }
        .dark-mode .notif-card .notif-actions-right button:hover {
            background: var(--bg-input);
        }
        .dark-mode .notif-card .notif-actions-right .mark-read-btn:hover {
            background: #1a3a2a;
            color: #2ecc71;
        }
        .dark-mode .notif-card .notif-actions-right .delete-btn:hover {
            background: #3a1a1a;
            color: #e74c3c;
        }

        .notif-card .notif-actions-right .mark-read-btn .fa-circle-check {
            color: var(--green);
        }
        .notif-card .notif-actions-right .mark-read-btn .fa-circle {
            color: var(--text-muted2);
        }

        @media (max-width: 480px) {
            .notif-card {
                padding: 12px 14px;
                gap: 10px;
                flex-wrap: wrap;
            }
            .notif-card .notif-icon {
                width: 34px;
                height: 34px;
                font-size: 15px;
            }
            .notif-card .notif-body .notif-title-text {
                font-size: 13px;
            }
            .notif-card .notif-body .notif-message {
                font-size: 12px;
            }
            .notif-card .notif-actions-right {
                margin-left: auto;
            }
            .notif-card .notif-actions-right button {
                font-size: 13px;
                padding: 2px 4px;
            }
            .notif-actions .action-btn {
                font-size: 11px;
                padding: 6px 14px;
            }
        }

        /* ─── Pagination ─── */
        .pagination-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-top: 8px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }
        .pagination-controls button {
            padding: 8px 20px;
            border: 2px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            border-radius: 30px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .pagination-controls button:hover:not(:disabled) {
            background: var(--green-bg);
            border-color: var(--green);
            color: var(--green);
            transform: translateY(-2px);
        }
        .pagination-controls button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }
        .pagination-controls .page-info {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
            min-width: 80px;
            text-align: center;
            transition: color var(--transition);
        }

        /* ─── Empty State ─── */
        .notif-empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            width: 100%;
        }
        .notif-empty .empty-icon {
            font-size: 64px;
            opacity: 0.3;
            margin-bottom: 16px;
            display: block;
            color: var(--text-muted2);
        }
        .notif-empty h3 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
            transition: color var(--transition);
        }
        .notif-empty p {
            font-size: 14px;
            color: var(--text-muted);
            max-width: 380px;
            margin: 0 auto;
            transition: color var(--transition);
        }

        /* ─── Toast ─── */
        .notif-toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: 14px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            border: 1px solid var(--border-color);
            font-size: 14px;
            font-weight: 500;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            gap: 12px;
            white-space: nowrap;
        }
        .notif-toast.visible {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }
        .notif-toast .toast-icon {
            font-size: 20px;
        }
        .notif-toast .toast-icon.success {
            color: var(--green);
        }
        .notif-toast .toast-icon.warning {
            color: #e67e22;
        }
        .notif-toast .toast-icon.danger {
            color: var(--red);
        }
        .dark-mode .notif-toast {
            background: var(--bg-card);
            border-color: var(--border-color);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        @media (max-width: 480px) {
            .notif-toast {
                font-size: 13px;
                padding: 10px 18px;
                white-space: normal;
                max-width: 90%;
                bottom: 90px;
            }
        }

        /* ─── Demo note ─── */
        .demo-note {
            text-align: center;
            font-size: 10px;
            color: var(--text-muted);
            padding: 8px 0 4px;
            letter-spacing: 0.3px;
            background: var(--bg-app);
            border-top: 1px solid var(--border-color);
            transition: background var(--transition), color var(--transition), border-color var(--transition);
        }
        .demo-note span {
            font-weight: 600;
            color: var(--green);
            transition: color var(--transition);
        }

        /* ─── Loading shimmer ─── */
        .shimmer-notif {
            display: flex;
            gap: 14px;
            padding: 14px 18px;
            background: var(--bg-card);
            border-radius: var(--radius-card);
            border: 1px solid var(--border-color);
            animation: shimmerPulse 1.5s ease-in-out infinite;
        }
        .shimmer-notif .shimmer-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--bg-input);
            flex-shrink: 0;
        }
        .shimmer-notif .shimmer-body {
            flex: 1;
        }
        .shimmer-notif .shimmer-body .line {
            height: 12px;
            background: var(--bg-input);
            border-radius: 6px;
            margin-bottom: 6px;
        }
        .shimmer-notif .shimmer-body .line.short {
            width: 30%;
        }
        .shimmer-notif .shimmer-body .line.long {
            width: 70%;
        }
        .shimmer-notif .shimmer-body .line:last-child {
            margin-bottom: 0;
        }
        @keyframes shimmerPulse {
            0%,
            100% {
                opacity: 0.6;
            }
            50% {
                opacity: 1;
            }
        }

        /* ─── Loading spinner ─── */
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }
        .loading-spinner .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-color);
            border-top-color: var(--green);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- ===== HEADER (injected by global.js) ===== -->

        <!-- ===== LOCATION ===== -->
        <div class="location-bar">
            <i class="fa-solid fa-location-dot"></i>
            <div class="loc-text">
                University of Benin <span>• Ugbowo</span>
            </div>
        </div>

        <!-- ===== MAIN ===== -->
        <main class="main-content" style="padding-top: 12px;">

            <!-- ===== HEADER ===== -->
            <div class="notif-header" id="notifHeader">
                <div class="notif-title">
                    <span class="bell-icon"><i class="fa-regular fa-bell"></i></span>
                    <h2>Notifications</h2>
                </div>
                <div class="notif-badge">
                    <i class="fa-regular fa-envelope"></i>
                    <span id="unreadCountDisplay">0</span> unread
                </div>
            </div>

            <!-- ===== FILTER TABS ===== -->
            <div class="notif-tabs" id="notifTabs">
                <button class="tab-btn active" data-filter="all">
                    <i class="fa-regular fa-bell"></i> All
                    <span class="tab-badge" id="allCount">0</span>
                </button>
                <button class="tab-btn" data-filter="unread">
                    <i class="fa-regular fa-envelope"></i> Unread
                    <span class="tab-badge unread-badge" id="unreadCountTab">0</span>
                </button>
                <button class="tab-btn" data-filter="read">
                    <i class="fa-regular fa-envelope-open"></i> Read
                    <span class="tab-badge" id="readCount">0</span>
                </button>
            </div>

            <!-- ===== ACTION BAR ===== -->
            <div class="notif-actions" id="notifActions">
                <button class="action-btn" id="markAllReadBtn" title="Mark all as read">
                    <i class="fa-regular fa-circle-check"></i> Mark all read
                </button>
                <button class="action-btn danger" id="deleteAllBtn" title="Delete all notifications">
                    <i class="fa-regular fa-trash-can"></i> Delete all
                </button>
                <span class="action-spacer"></span>
                <span class="result-count" id="notifResultCount">0 notifications</span>
            </div>

            <!-- ===== NOTIFICATION LIST ===== -->
            <div id="notifList" class="notif-list">
                <!-- Populated by JS -->
            </div>

            <!-- ===== PAGINATION ===== -->
            <div class="pagination-controls" id="notifPagination">
                <button id="notifPrev" disabled><i class="fa-solid fa-chevron-left"></i> Prev</button>
                <span class="page-info" id="notifPageInfo">Page 1</span>
                <button id="notifNext">Next <i class="fa-solid fa-chevron-right"></i></button>
            </div>

        </main>

        <!-- ===== TOAST ===== -->
        <div class="notif-toast" id="notifToast">
            <span class="toast-icon" id="toastIcon"><i class="fa-regular fa-circle-check"></i></span>
            <span id="toastMessage">Action completed</span>
        </div>

        <!-- ===== DEMO NOTE ===== -->
        <div class="demo-note">
            <span>CampusHub</span> • Notifications
        </div>

    </div>

    <!-- ===== SCRIPTS ===== -->
    <script src="/assets/js/modal.js"></script>
    <script src="/assets/js/showAlert.js"></script>
    <script src="/assets/js/global.js"></script>

    <script>
        (function() {
            'use strict';

            // ============================================================
            // API ENDPOINTS
            // ============================================================
            const NOTIFICATIONS_BASE = `${NOTIFICATIONS_URL}`;
            const MARK_ALL_READ_URL = NOTIFICATIONS_BASE + 'all-mark-read';
            const DELETE_ALL_URL = NOTIFICATIONS_BASE + 'delete-all';
            const DELETE_ONE_URL = NOTIFICATIONS_BASE + 'delete/';
            const MARK_READ_URL = NOTIFICATIONS_BASE + 'mark-read/';

            // ============================================================
            // DOM REFS
            // ============================================================
            const list = document.getElementById('notifList');
            const filterTabs = document.querySelectorAll('.notif-tabs .tab-btn');
            const allCount = document.getElementById('allCount');
            const unreadCountTab = document.getElementById('unreadCountTab');
            const readCount = document.getElementById('readCount');
            const unreadCountDisplay = document.getElementById('unreadCountDisplay');
            const resultCount = document.getElementById('notifResultCount');
            const prevBtn = document.getElementById('notifPrev');
            const nextBtn = document.getElementById('notifNext');
            const pageInfo = document.getElementById('notifPageInfo');

            const markAllReadBtn = document.getElementById('markAllReadBtn');
            const deleteAllBtn = document.getElementById('deleteAllBtn');

            const toast = document.getElementById('notifToast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            // ============================================================
            // STATE
            // ============================================================
            let allNotifications = [];
            let currentFilter = 'all';
            let currentPage = 1;
            const perPage = 10;
            let totalItems = 0;
            let totalPages = 1;
            let isLoading = false;

            // ============================================================
            // HELPERS
            // ============================================================
            function getIconForType(type) {
                const map = {
                    'listing': 'fas fa-tag',
                    'account': 'fas fa-user',
                    'system': 'fas fa-gear',
                    'transaction': 'fas fa-coins',
                    'others': 'fas fa-bell'
                };
                return map[type] || 'fas fa-bell';
            }

            function getIconClass(type) {
                const map = {
                    'listing': 'listing',
                    'account': 'account',
                    'system': 'system',
                    'transaction': 'transaction',
                    'others': 'others'
                };
                return map[type] || 'others';
            }

            function getFilterParam() {
                if (currentFilter === 'all') return '';
                if (currentFilter === 'unread') return '?is_read=false';
                if (currentFilter === 'read') return '?is_read=true';
                return '';
            }

            // ============================================================
            // TOAST
            // ============================================================
            let toastTimer = null;

            function showToast(message, type = 'success') {
                toastMessage.textContent = message;
                toastIcon.className = 'toast-icon';
                if (type === 'success') toastIcon.classList.add('success', 'fa-regular', 'fa-circle-check');
                else if (type === 'warning') toastIcon.classList.add('warning', 'fa-regular', 'fa-triangle-exclamation');
                else if (type === 'danger') toastIcon.classList.add('danger', 'fa-regular', 'fa-circle-xmark');
                else toastIcon.classList.add('success', 'fa-regular', 'fa-circle-check');

                toast.classList.add('visible');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toast.classList.remove('visible');
                }, 3500);
            }

            function hideToast() {
                toast.classList.remove('visible');
                clearTimeout(toastTimer);
            }

            // ============================================================
            // API CALLS
            // ============================================================
            async function fetchNotifications(page = 1) {
                if (isLoading) return;
                isLoading = true;
                
                showLoading(list);

                try {
                    let url = NOTIFICATIONS_URL;
                    const filterParam = getFilterParam();
                    if (filterParam) {
                        url += filterParam;
                        if (page > 1) {
                            url += '&page=' + page;
                        }
                    } else if (page > 1) {
                        url += '?page=' + page;
                    }

                    const response = await fetchWithAuth(url, {
                        method: 'GET'
                    });

                    if (!response.ok) {
                        throw new Error('Failed to fetch notifications');
                    }

                    const result = await response.json();
                    
                    if (result.is_success) {
                        allNotifications = result.data.notifications || [];
                        totalItems = result.data.pagination?.total_items || 0;
                        totalPages = result.data.pagination?.total_pages || 1;
                        currentPage = result.data.pagination?.page || 1;
                        
                        // Update unread count from response
                        if (result.data.unread_messages_counts !== undefined) {
                            unreadCountDisplay.textContent = result.data.unread_messages_counts;
                        }
                        
                        renderNotifications();
                    } else {
                        showToast(result.message || 'Failed to load notifications', 'danger');
                    }
                } catch (error) {
                    console.error('Fetch notifications error:', error);
                    showToast('Failed to load notifications. Please try again.', 'danger');
                    list.innerHTML = `
                        <div class="notif-empty">
                            <span class="empty-icon"><i class="fa-regular fa-circle-xmark"></i></span>
                            <h3>Error loading notifications</h3>
                            <p>Please refresh the page to try again.</p>
                        </div>
                    `;
                } finally {
                    isLoading = false;
                }
            }

            async function markAsRead(id) {
                try {
                    const response = await fetchWithAuth(MARK_READ_URL + id, {
                        method: 'PUT'
                    });

                    const result = await response.json();
                    
                    if (response.ok && result.is_success) {
                        showToast(result.message || 'Marked as read', 'success');
                        await fetchNotifications(currentPage);
                    } else {
                        showToast(result.message || 'Failed to mark as read', 'danger');
                    }
                } catch (error) {
                    console.error('Mark as read error:', error);
                    showToast('Failed to mark as read. Please try again.', 'danger');
                }
            }

            async function deleteNotification(id) {
                try {
                    const response = await fetchWithAuth(DELETE_ONE_URL + id, {
                        method: 'DELETE'
                    });

                    const result = await response.json();
                    
                    if (response.ok && result.is_success) {
                        showToast(result.message || 'Notification deleted', 'success');
                        await fetchNotifications(currentPage);
                    } else {
                        showToast(result.message || 'Failed to delete notification', 'danger');
                    }
                } catch (error) {
                    console.error('Delete notification error:', error);
                    showToast('Failed to delete notification. Please try again.', 'danger');
                }
            }

            async function markAllAsRead() {
                if (allNotifications.length === 0) {
                    showToast('No notifications to mark as read', 'warning');
                    return;
                }

                try {
                    const response = await fetchWithAuth(MARK_ALL_READ_URL, {
                        method: 'PUT'
                    });

                    const result = await response.json();
                    
                    if (response.ok && result.is_success) {
                        showToast(result.message || 'All notifications marked as read', 'success');
                        await fetchNotifications(currentPage);
                    } else {
                        showToast(result.message || 'Failed to mark all as read', 'danger');
                    }
                } catch (error) {
                    console.error('Mark all as read error:', error);
                    showToast('Failed to mark all as read. Please try again.', 'danger');
                }
            }

            async function deleteAllNotifications() {
                if (allNotifications.length === 0) {
                    showToast('No notifications to delete', 'warning');
                    return;
                }

                // Confirm via modal if available
                const doDelete = async () => {
                    try {
                        const response = await fetchWithAuth(DELETE_ALL_URL, {
                            method: 'DELETE'
                        });

                        const result = await response.json();
                        
                        if (response.ok && result.is_success) {
                            showToast(result.message || 'All notifications deleted', 'success');
                            await fetchNotifications(1);
                        } else {
                            showToast(result.message || 'Failed to delete all notifications', 'danger');
                        }
                    } catch (error) {
                        console.error('Delete all error:', error);
                        showToast('Failed to delete all notifications. Please try again.', 'danger');
                    }
                };

                if (typeof Modal !== 'undefined') {
                    const modal = new Modal({
                        title: 'Delete all notifications?',
                        body: `<p>This will permanently delete all ${allNotifications.length} notifications. This action cannot be undone.</p>`,
                        type: 'danger',
                        confirmText: 'Delete All',
                        cancelText: 'Cancel',
                        onConfirm: doDelete
                    });
                    modal.open();
                } else {
                    if (confirm(`Delete all ${allNotifications.length} notifications?`)) {
                        doDelete();
                    }
                }
            }

            // ============================================================
            // RENDER
            // ============================================================
            function showLoading(container) {
                container.innerHTML = `
                    <div class="loading-spinner">
                        <div class="spinner"></div>
                    </div>
                `;
            }

            function renderNotifications() {
                const total = totalItems;
                const totalPagesCalc = totalPages;

                // Update counts
                const unreadCount = allNotifications.filter(n => !n.is_read).length;
                const readCountVal = allNotifications.filter(n => n.is_read).length;
                
                unreadCountTab.textContent = unreadCount;
                allCount.textContent = total;
                readCount.textContent = readCountVal;
                resultCount.textContent = `${total} notification${total !== 1 ? 's' : ''}`;
                pageInfo.textContent = `Page ${currentPage} of ${totalPagesCalc}`;
                prevBtn.disabled = currentPage <= 1;
                nextBtn.disabled = currentPage >= totalPagesCalc;

                if (allNotifications.length === 0) {
                    const emptyMsg = currentFilter === 'all' ? 'No notifications yet' :
                        currentFilter === 'unread' ? 'All caught up! No unread notifications.' :
                        'No read notifications.';
                    list.innerHTML = `
                        <div class="notif-empty">
                            <span class="empty-icon"><i class="fa-regular fa-bell-slash"></i></span>
                            <h3>${emptyMsg}</h3>
                            <p>${currentFilter === 'all' ? 'When you get notifications, they will appear here.' : ''}</p>
                        </div>
                    `;
                    return;
                }

                list.innerHTML = allNotifications.map(item => {
                    const icon = getIconForType(item.notification_type);
                    const iconClass = getIconClass(item.notification_type);
                    const isUnread = !item.is_read;
                    const readBadgeClass = isUnread ? 'unread-badge' : '';
                    const readBadgeText = isUnread ? 'Unread' : 'Read';

                    return `
                        <div class="notif-card ${isUnread ? 'unread' : ''}" data-id="${item.id}" data-url="${item.action_url || '#'}">
                            <div class="notif-icon ${iconClass}">
                                <i class="fa-regular ${icon}"></i>
                            </div>
                            <div class="notif-body">
                                <div class="notif-title-text">${item.title}</div>
                                <div class="notif-message">${item.message}</div>
                                <div class="notif-meta">
                                    <span class="time"><i class="fa-regular fa-clock"></i> ${item.created_at}</span>
                                    <span class="read-badge ${readBadgeClass}">${readBadgeText}</span>
                                </div>
                            </div>
                            <div class="notif-actions-right">
                                <button class="mark-read-btn" data-id="${item.id}" title="${isUnread ? 'Mark as read' : 'Mark as unread'}">
                                    ${isUnread ? '<i class="fa-regular fa-circle"></i>' : '<i class="fa-regular fa-circle-check"></i>'}
                                </button>
                                <button class="delete-btn" data-id="${item.id}" title="Delete notification">
                                    <i class="fa-regular fa-trash-can"></i>
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');

                // ─── Attach event listeners ───
                // Card click → navigate to action_url
                list.querySelectorAll('.notif-card').forEach(card => {
                    card.addEventListener('click', function(e) {
                        // Don't navigate if click was on a button
                        if (e.target.closest('button')) return;
                        
                        const url = this.dataset.url;
                        if (url && url !== '#') {
                            window.location.href = url;
                        }
                    });
                });

                // Mark read/unread button
                list.querySelectorAll('.mark-read-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = parseInt(this.dataset.id);
                        markAsRead(id);
                    });
                });

                // Delete button
                list.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = parseInt(this.dataset.id);
                        deleteNotification(id);
                    });
                });
            }

            // ============================================================
            // FILTER TABS
            // ============================================================
            filterTabs.forEach(btn => {
                btn.addEventListener('click', function() {
                    filterTabs.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    currentPage = 1;
                    fetchNotifications(1);
                });
            });

            // ============================================================
            // PAGINATION
            // ============================================================
            prevBtn.addEventListener('click', function() {
                if (currentPage > 1) {
                    fetchNotifications(currentPage - 1);
                }
            });

            nextBtn.addEventListener('click', function() {
                if (currentPage < totalPages) {
                    fetchNotifications(currentPage + 1);
                }
            });

            // ============================================================
            // BULK ACTIONS
            // ============================================================
            markAllReadBtn.addEventListener('click', markAllAsRead);
            deleteAllBtn.addEventListener('click', deleteAllNotifications);

            // ============================================================
            // KEYBOARD SHORTCUTS
            // ============================================================
            document.addEventListener('keydown', function(e) {
                if (e.key === 'r' && !e.ctrlKey && !e.metaKey && !e.target.closest('input, textarea, button')) {
                    e.preventDefault();
                    markAllAsRead();
                }
            });

            // ============================================================
            // INIT
            // ============================================================
            function init() {
                // Show loading state
                list.innerHTML = `
                    <div class="loading-spinner">
                        <div class="spinner"></div>
                    </div>
                `;
                
                fetchNotifications(1);
                console.log('Notifications page initialized');
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                setTimeout(init, 100);
            }

        })();
    </script>

</body>
</html>
