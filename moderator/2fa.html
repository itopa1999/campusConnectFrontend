<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>CampusHub – Two-Factor Authentication</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- Global Styles -->
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="icon" type="image/jpeg" href="../assets/img/icon.jpg">

    <!-- Page-Specific Styles -->
    <style>
        .mfa-wrapper {
            max-width: 800px;
            margin: 0 auto;
        }

        .mfa-card {
            background: var(--bg-card);
            border-radius: var(--radius-card);
            padding: 24px 28px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-card);
            transition: background var(--transition), border-color var(--transition), box-shadow var(--transition);
            margin-bottom: 20px;
        }

        .mfa-card .card-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: color var(--transition);
        }
        .mfa-card .card-title i {
            color: var(--green);
            font-size: 22px;
        }
        .mfa-card .card-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
            transition: color var(--transition);
        }

        /* ─── Methods Grid ─── */
        .methods-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }

        .method-card {
            background: var(--bg-input);
            border-radius: 14px;
            padding: 18px 20px 20px;
            border: 2px solid transparent;
            transition: all var(--transition);
            cursor: default;
            position: relative;
        }
        .method-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-card-hover);
            background: var(--bg-card);
            border-color: var(--border-color);
        }
        .method-card .method-icon {
            font-size: 28px;
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--green-bg);
            color: var(--green);
            margin-bottom: 10px;
            transition: background var(--transition), color var(--transition);
        }
        .method-card .method-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 2px;
            transition: color var(--transition);
        }
        .method-card .method-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
            margin-bottom: 12px;
            transition: color var(--transition);
        }
        .method-card .method-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            padding: 3px 14px;
            border-radius: 30px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            transition: background var(--transition), color var(--transition), border-color var(--transition);
        }
        .method-card .method-status .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .method-card .method-status .status-dot.enabled {
            background: var(--green);
        }
        .method-card .method-status .status-dot.disabled {
            background: var(--text-muted);
        }

        .method-card .method-action {
            margin-top: 12px;
            width: 100%;
            padding: 8px 0;
            border: none;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .method-card .method-action.enable {
            background: var(--green);
            color: #fff;
        }
        .method-card .method-action.enable:hover {
            opacity: 0.9;
            transform: scale(0.97);
        }
        .method-card .method-action.disable {
            background: var(--bg-input);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        .method-card .method-action.disable:hover {
            background: var(--border-color);
        }

        /* ─── Active / Subscribed Highlight ─── */
        .method-card.active {
            border-color: var(--green);
            background: var(--green-bg);
            box-shadow: 0 0 0 3px rgba(13, 138, 62, 0.08);
        }
        .method-card.active .method-icon {
            background: var(--bg-card);
            color: var(--green);
        }
        .method-card.active .method-status {
            border-color: var(--green);
            background: var(--bg-card);
            color: var(--green);
        }
        .method-card.active .method-status .status-dot {
            background: var(--green);
        }

        .dark-mode .method-card.active {
            background: rgba(46, 204, 113, 0.06);
            border-color: #2ecc71;
            box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.08);
        }
        .dark-mode .method-card.active .method-status {
            border-color: #2ecc71;
            background: var(--bg-card);
            color: #2ecc71;
        }

        .method-card .active-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--green);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* ─── Loading ─── */
        .mfa-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 0;
            gap: 12px;
        }
        .mfa-loading .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-color);
            border-top-color: var(--green);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .mfa-loading p {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* ─── Responsive ─── */
        @media (max-width: 480px) {
            .mfa-card {
                padding: 16px 18px;
            }
            .mfa-card .card-title {
                font-size: 17px;
            }
            .methods-grid {
                grid-template-columns: 1fr;
            }
            .method-card {
                padding: 14px 16px 16px;
            }
        }

        /* ─── Demo note ─── */
        .demo-note {
            text-align: center;
            font-size: 10px;
            color: var(--text-muted);
            padding: 8px 0 4px;
            letter-spacing: 0.3px;
            background: var(--bg-app);
            border-top: 1px solid var(--border-color);
            transition: background var(--transition), color var(--transition), border-color var(--transition);
        }
        .demo-note span {
            font-weight: 600;
            color: var(--green);
            transition: color var(--transition);
        }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- ===== HEADER (injected by global.js) ===== -->

        <!-- ===== LOCATION ===== -->
        <div class="location-bar">
            <i class="fa-solid fa-location-dot"></i>
            <div class="loc-text">
                University of Benin <span>• Ugbowo</span>
            </div>
        </div>

        <!-- ===== MAIN ===== -->
        <main class="main-content" style="padding-top: 12px;">

            <div class="mfa-wrapper">

                <!-- ===== MFA CARD ===== -->
                <div class="mfa-card" id="mfaCard">
                    <div class="card-title">
                        <i class="fa-regular fa-shield-halved"></i> Two-Factor Authentication
                    </div>
                    <div class="card-subtitle">Choose a method to secure your account with 2FA</div>

                    <!-- Loading state -->
                    <div id="mfaLoadingState" class="mfa-loading">
                        <div class="spinner"></div>
                        <p>Loading security methods…</p>
                    </div>

                    <!-- Content (hidden until loaded) -->
                    <div id="mfaContent" style="display:none;">

                        <div class="methods-grid" id="methodsGrid">
                            <!-- Populated by JS -->
                        </div>

                    </div><!-- /mfaContent -->
                </div><!-- /mfa-card -->

            </div><!-- /mfa-wrapper -->

        </main>

        <!-- ===== DEMO NOTE ===== -->
        <div class="demo-note">
            <span>CampusHub</span> • Two-Factor Authentication • dummy data for preview
        </div>

    </div>

    <!-- ===== SCRIPTS ===== -->
    <script src="/assets/js/global.js"></script>
    <script src="/assets/js/modal.js"></script>
    <script src="/assets/js/showAlert.js"></script>

    <script>
        (function() {
            'use strict';

            // ─── DOM refs ──────────────────────────────────────────────
            const loadingState = document.getElementById('mfaLoadingState');
            const content = document.getElementById('mfaContent');
            const methodsGrid = document.getElementById('methodsGrid');

            // ─── Dummy data (simulate endpoint) ──────────────────────
            // Only one method should have `is_enabled: true` (the one the user is subscribed to)
            const DUMMY_METHODS = {
                methods: [{
                    id: 1,
                    name: 'Authenticator App',
                    description: 'Use Google Authenticator, Microsoft Authenticator, or Authy.',
                    icon: 'fa-regular fas fa-mobile-screen-button',
                    is_enabled: true,
                }, {
                    id: 2,
                    name: 'SMS (Text Message)',
                    description: 'Receive a one-time code via SMS on your registered phone number.',
                    icon: 'fa-regular fas fa-comment-sms',
                    is_enabled: false,
                }, {
                    id: 3,
                    name: 'Email OTP',
                    description: 'Get a verification code sent to your registered email address.',
                    icon: 'fa-regular fas fa-envelope',
                    is_enabled: false,
                }, {
                    id: 4,
                    name: 'Hardware Token (YubiKey)',
                    description: 'Use a physical USB/NFC security key for authentication.',
                    icon: 'fas fa-usb',
                    is_enabled: false,
                }, {
                    id: 5,
                    name: 'Backup Codes',
                    description: 'Generate a set of one-time use backup codes for emergencies.',
                    icon: 'fa-regular fas fa-key',
                    is_enabled: false,
                }]
            };

            // ─── Fetch 2FA methods (simulated) ────────────────────────
            function fetchMethods() {
                return new Promise((resolve) => {
                    setTimeout(() => {
                        // You can randomize which one is active for testing:
                        // const idx = Math.floor(Math.random() * DUMMY_METHODS.methods.length);
                        // DUMMY_METHODS.methods.forEach((m, i) => m.is_enabled = i === idx);
                        resolve(DUMMY_METHODS);
                    }, 600);
                });
            }

            // ─── Render methods ─────────────────────────────────────────
            function renderMethods(data) {
                const methods = data.methods || [];

                loadingState.style.display = 'none';
                content.style.display = 'block';

                if (methods.length === 0) {
                    methodsGrid.innerHTML = `
                            <div style="grid-column:1/-1; text-align:center; padding:40px 20px; color:var(--text-muted);">
                                <span style="font-size:48px; display:block; margin-bottom:12px;">🔐</span>
                                <h3 style="color:var(--text-primary);">No 2FA methods available</h3>
                                <p>Please check back later.</p>
                            </div>
                        `;
                    return;
                }

                let html = '';
                methods.forEach(method => {
                    const isActive = method.is_enabled || false;
                    const cardClass = isActive ? 'method-card active' : 'method-card';
                    const statusText = isActive ? 'Enabled' : 'Disabled';
                    const statusDotClass = isActive ? 'enabled' : 'disabled';
                    const actionClass = isActive ? 'disable' : 'enable';
                    const actionText = isActive ? 'Disable' : 'Enable';

                    html += `
                            <div class="${cardClass}" data-id="${method.id}">
                                ${isActive ? '<span class="active-badge"><i class="fa-regular fa-circle-check"></i> Active</span>' : ''}
                                <div class="method-icon"><i class="${method.icon}"></i></div>
                                <div class="method-name">${method.name}</div>
                                <div class="method-desc">${method.description}</div>
                                <div class="method-status">
                                    <span class="status-dot ${statusDotClass}"></span>
                                    ${statusText}
                                </div>
                                <button class="method-action ${actionClass}" data-id="${method.id}" data-action="${isActive ? 'disable' : 'enable'}">
                                    ${actionText} ${method.name.split(' ')[0]}
                                </button>
                            </div>
                        `;
                });

                methodsGrid.innerHTML = html;

                // ─── Attach action event listeners ──────────────────────
                methodsGrid.querySelectorAll('.method-action').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = parseInt(this.dataset.id);
                        const action = this.dataset.action; // 'enable' or 'disable'
                        const method = methods.find(m => m.id === id);
                        if (method) {
                            handleMethodAction(method, action);
                        }
                    });
                });
            }

            // ─── Handle enable/disable action ──────────────────────────
            function handleMethodAction(method, action) {
                const methodName = method.name;

                // If trying to disable the active one, confirm first
                if (action === 'disable' && method.is_enabled) {
                    const doDisable = () => {
                        // Simulate API call
                        const btn = document.querySelector(`.method-action[data-id="${method.id}"]`);
                        if (btn) {
                            btn.disabled = true;
                            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
                        }

                        setTimeout(() => {
                            // Disable all, then enable the clicked one if it's enable action
                            DUMMY_METHODS.methods.forEach(m => m.is_enabled = false);
                            // Re-fetch and re-render
                            fetchMethods().then(data => renderMethods(data));
                            if (typeof showAlert !== 'undefined') {
                                showAlert.success(`${methodName} disabled.`, { duration: 2000 });
                            }
                        }, 800);
                    };

                    if (typeof Modal !== 'undefined') {
                        const modal = new Modal({
                            title: 'Disable 2FA Method',
                            body: `
                                    <p>Are you sure you want to disable <strong>${methodName}</strong>?</p>
                                    <p style="color:var(--text-muted); font-size:13px;">Your account will be less secure without this method.</p>
                                `,
                            type: 'warning',
                            confirmText: 'Disable',
                            cancelText: 'Cancel',
                            onConfirm: doDisable
                        });
                        modal.open();
                    } else {
                        if (confirm(`Disable ${methodName}? Your account will be less secure.`)) {
                            doDisable();
                        }
                    }
                    return;
                }

                // ─── Enable action ──────────────────────────────────────
                if (action === 'enable') {
                    const doEnable = () => {
                        const btn = document.querySelector(`.method-action[data-id="${method.id}"]`);
                        if (btn) {
                            btn.disabled = true;
                            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
                        }

                        setTimeout(() => {
                            // Disable all, then enable the clicked one
                            DUMMY_METHODS.methods.forEach(m => m.is_enabled = false);
                            const target = DUMMY_METHODS.methods.find(m => m.id === method.id);
                            if (target) target.is_enabled = true;
                            // Re-render
                            fetchMethods().then(data => renderMethods(data));
                            if (typeof showAlert !== 'undefined') {
                                showAlert.success(`${methodName} enabled.`, { duration: 2000 });
                            }
                        }, 800);
                    };

                    if (typeof Modal !== 'undefined') {
                        const modal = new Modal({
                            title: 'Enable 2FA Method',
                            body: `
                                    <p>Enable <strong>${methodName}</strong> for your account?</p>
                                    <p style="color:var(--text-muted); font-size:13px;">This will add an extra layer of security to your account.</p>
                                `,
                            type: 'success',
                            confirmText: 'Enable',
                            cancelText: 'Cancel',
                            onConfirm: doEnable
                        });
                        modal.open();
                    } else {
                        if (confirm(`Enable ${methodName}?`)) {
                            doEnable();
                        }
                    }
                }
            }

            // ─── Init ──────────────────────────────────────────────────
            function init() {
                fetchMethods().then(data => {
                    renderMethods(data);
                }).catch(err => {
                    loadingState.innerHTML = `
                            <p style="color:var(--red);">❌ Failed to load 2FA methods. Please refresh.</p>
                        `;
                    console.error('Error fetching 2FA methods:', err);
                });
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                setTimeout(init, 200);
            }

        })();
    </script>

</body>
</html>
