<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>2FA Verification – CampusConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/jpeg" href="../assets/img/icon.jpg">
  <link rel="stylesheet" href="../assets/css/main.css">
  <style>
    /* ── Override auth-wrapper for single card ── */
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-app, #f6f8f7);
      padding: 1.5rem;
    }
    .auth-shell {
      max-width: 480px;
      width: 100%;
      background: var(--bg-card, #ffffff);
      border-radius: var(--card-radius, 28px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.08);
      border: 1px solid var(--border-color, #eef2f0);
      padding: 2.5rem 2rem 2rem;
      transition: all 0.3s ease;
    }
    .auth-card-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-card-header .auth-logo {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      object-fit: cover;
      margin-bottom: 0.75rem;
      box-shadow: 0 8px 24px rgba(44,122,94,0.12);
    }
    .auth-card-header h2 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-dark, #1e2a2c);
      margin-bottom: 0.25rem;
    }
    .auth-card-header p {
      color: var(--text-muted, #5a6e6f);
      font-size: 0.95rem;
      margin-bottom: 0;
    }
    .method-icon {
      font-size: 3rem;
      color: var(--accent, #2c7a5e);
      margin-bottom: 0.5rem;
      display: block;
    }
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .auth-form .form-floating-label {
      position: relative;
      margin-top: 1rem;
    }
    .auth-form .form-floating-label .form-label {
      position: absolute;
      top: 0;
      left: 0;
      transform: translateY(-50%);
      background: var(--bg-card, #ffffff);
      padding: 0 0.5rem;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent, #2c7a5e);
      pointer-events: none;
      transition: color 0.2s;
    }
    .auth-form .form-control {
      min-height: 56px;
      border-radius: 16px;
      border: 1.5px solid rgba(44,122,94,0.14);
      background: var(--bg-input, #ffffff);
      padding: 0.9rem 1rem;
      font-size: 1rem;
      font-weight: 500;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .auth-form .form-control:focus {
      border-color: var(--accent, #2c7a5e);
      box-shadow: 0 0 0 4px rgba(44,122,94,0.1);
      outline: none;
    }
    .auth-form .btn-primary-custom {
      background: var(--accent, #2c7a5e);
      border: none;
      padding: 14px 30px;
      font-weight: 700;
      border-radius: 40px;
      color: white;
      transition: all 0.2s;
      font-size: 1rem;
      width: 100%;
    }
    .auth-form .btn-primary-custom:hover:not(:disabled) {
      background: var(--accent-dark, #1f5e48);
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(44,122,94,0.2);
    }
    .auth-form .btn-primary-custom:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .backup-link {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted, #5a6e6f);
      margin-top: 0.25rem;
    }
    .backup-link button {
      background: none;
      border: none;
      color: var(--accent, #2c7a5e);
      font-weight: 600;
      text-decoration: underline;
      cursor: pointer;
      padding: 0;
      transition: color 0.2s;
    }
    .backup-link button:hover {
      color: var(--accent-dark, #1f5e48);
    }
    .backup-link.hidden {
      display: none;
    }
    .auth-meta {
      font-size: 0.85rem;
      color: var(--text-muted, #5a6e6f);
      text-align: center;
      margin-top: 1.5rem;
    }
    .auth-meta a {
      color: var(--accent, #2c7a5e);
      font-weight: 600;
      text-decoration: none;
    }
    .auth-meta a:hover {
      text-decoration: underline;
    }
    #verifyError {
      color: var(--red, #dc3545);
      font-size: 0.9rem;
      text-align: center;
      margin-top: 0.75rem;
      display: none;
    }
    .go-back-link {
      text-align: center;
      margin-top: 0.5rem;
    }
    .go-back-link button {
      background: none;
      border: none;
      color: var(--text-muted, #5a6e6f);
      font-size: 0.85rem;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
    }
    .go-back-link button:hover {
      color: var(--accent, #2c7a5e);
    }
    @media (max-width: 480px) {
      .auth-shell {
        padding: 1.5rem 1.25rem;
      }
      .auth-card-header h2 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
<main class="auth-wrapper">
  <div class="auth-shell" data-aos="fade-up" data-aos-duration="600">
    <div class="auth-card-header">
      <img src="../assets/img/icon.jpg" alt="CampusConnect" class="auth-logo">
      <span class="method-icon" id="methodIcon"><i class="fas fa-mobile-screen-button"></i></span>
      <h2 id="authHeaderTitle">Two‑Factor Authentication</h2>
      <p id="authHeaderSub">Enter the code from your authenticator app</p>
    </div>

    <form id="verify2faForm" class="auth-form">
      <div class="form-floating-label">
        <input type="text" class="form-control" id="verificationCode" placeholder=" " required autocomplete="off" inputmode="numeric" maxlength="8">
        <label class="form-label required" for="verificationCode" id="codeLabel">Verification code</label>
      </div>
      <button type="submit" class="btn btn-primary-custom" id="verifyBtn">Verify</button>
    </form>

    <!-- Backup link (visible only for TOTP) -->
    <div class="backup-link" id="backupLink">
      <span>Lost access? </span>
      <button type="button" id="useBackupBtn">Use a backup code</button>
    </div>

    <!-- Go back to TOTP (visible only in backup mode) -->
    <div class="go-back-link hidden" id="goBackLink">
      <button type="button" id="goBackBtn">← Back to verification code</button>
    </div>

    <div class="auth-meta">
      <a href="../auth/auth.html">← Back to sign in</a>
    </div>

    <div id="verifyError"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
  AOS.init();

  (function() {
    // ─── Load 2FA data ────────────────────────────────────────────
    const stored = sessionStorage.getItem('2fa_data');
    if (!stored) {
      window.location.href = 'auth.html';
      return;
    }

    const data = JSON.parse(stored);
    const { user_id, active_method, platform } = data;

    let isBackupMode = false;

    // ─── DOM refs ──────────────────────────────────────────────────
    const methodIcon = document.getElementById('methodIcon');
    const authHeaderTitle = document.getElementById('authHeaderTitle');
    const authHeaderSub = document.getElementById('authHeaderSub');
    const codeLabel = document.getElementById('codeLabel');
    const codeInput = document.getElementById('verificationCode');
    const verifyBtn = document.getElementById('verifyBtn');
    const errorEl = document.getElementById('verifyError');
    const backupLink = document.getElementById('backupLink');
    const useBackupBtn = document.getElementById('useBackupBtn');
    const goBackLink = document.getElementById('goBackLink');
    const goBackBtn = document.getElementById('goBackBtn');
    const form = document.getElementById('verify2faForm');

    const originalBtnText = verifyBtn.textContent;

    // ─── Method config ──────────────────────────────────────────────
    const methodMap = {
      'totp': {
        icon: 'fa-mobile-screen-button',
        title: 'Authenticator App',
        display: 'authenticator app',
        description: 'Enter the 6‑digit code from your authenticator app',
        placeholder: '6-digit code',
        maxlength: 6,
        backupAvailable: true
      },
      'sms': {
        icon: 'fa-comment-sms',
        title: 'SMS Verification',
        display: 'phone',
        description: 'We sent a code to your phone. Enter it below.',
        placeholder: '6-digit code',
        maxlength: 6,
        backupAvailable: false
      },
      'email': {
        icon: 'fa-envelope',
        title: 'Email Verification',
        display: 'email',
        description: 'We sent a code to your email. Check your inbox.',
        placeholder: '6-digit code',
        maxlength: 6,
        backupAvailable: false
      },
      'hardware': {
        icon: 'fa-usb',
        title: 'Hardware Token',
        display: 'security key',
        description: 'Tap your hardware token and enter the code.',
        placeholder: '6-8 digit code',
        maxlength: 8,
        backupAvailable: false
      }
    };

    const methodInfo = methodMap[active_method] || methodMap['totp'];

    // ─── Apply UI ───────────────────────────────────────────────────
    function applyMethodUI() {
      methodIcon.innerHTML = `<i class="fas ${methodInfo.icon}"></i>`;
      authHeaderTitle.textContent = methodInfo.title;
      authHeaderSub.textContent = methodInfo.description;
      codeLabel.textContent = 'Verification code';
      codeInput.placeholder = methodInfo.placeholder;
      codeInput.maxLength = methodInfo.maxlength;
      codeInput.setAttribute('inputmode', 'numeric');
      verifyBtn.textContent = 'Verify';
      backupLink.classList.toggle('hidden', !methodInfo.backupAvailable);
      goBackLink.classList.add('hidden');
      isBackupMode = false;
      errorEl.style.display = 'none';
      codeInput.value = '';
      codeInput.focus();
    }

    // ─── Switch to backup mode ─────────────────────────────────────
    function switchToBackupMode() {
      isBackupMode = true;
      methodIcon.innerHTML = '<i class="fas fa-key"></i>';
      authHeaderTitle.textContent = 'Backup Code';
      authHeaderSub.textContent = 'Enter one of your unused backup codes. Each code can only be used once.';
      codeLabel.textContent = 'Backup code';
      codeInput.placeholder = '8-character backup code';
      codeInput.maxLength = 8;
      codeInput.setAttribute('inputmode', 'text');
      verifyBtn.textContent = 'Verify Backup Code';
      backupLink.classList.add('hidden');
      goBackLink.classList.remove('hidden');
      errorEl.style.display = 'none';
      codeInput.value = '';
      codeInput.focus();
    }

    // ─── Go back to TOTP mode ──────────────────────────────────────
    function goBackToTOTP() {
      isBackupMode = false;
      // Re‑apply the original method UI (not backup)
      applyMethodUI();
    }

    // ─── Apply initial UI ──────────────────────────────────────────
    applyMethodUI();

    // ─── Input filtering ───────────────────────────────────────────
    codeInput.addEventListener('input', function() {
      if (!isBackupMode) {
        this.value = this.value.replace(/\D/g, '').slice(0, this.maxLength);
      } else {
        // Allow only hex characters (0-9, A-F, a-f)
        this.value = this.value.replace(/[^0-9A-Fa-f]/g, '').slice(0, this.maxLength);
      }
    });

    // ─── Backup button ─────────────────────────────────────────────
    useBackupBtn.addEventListener('click', function(e) {
      e.preventDefault();
      switchToBackupMode();
    });

    // ─── Go back button ────────────────────────────────────────────
    goBackBtn.addEventListener('click', function(e) {
      e.preventDefault();
      goBackToTOTP();
    });

    // ─── Form submission ──────────────────────────────────────────
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = codeInput.value.trim();
      if (!code) {
        errorEl.textContent = 'Please enter the verification code.';
        errorEl.style.display = 'block';
        return;
      }
      errorEl.style.display = 'none';

      verifyBtn.disabled = true;
      verifyBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verifying…';

      const method = isBackupMode ? 'backup' : active_method;

      try {
        const response = await fetchWithAuth(`${AUTH_URL}2fa/login-totp`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json',
            'X-Key-Id': '1',
          },
          body: JSON.stringify({
            user_id: user_id,
            platform: platform,
            code: code,
            method: method,
          })
        });

        const result = await response.json();

        if (response.ok && result.is_success === true) {
          // ─── Success – store user, clear 2fa_data, redirect ──
          const user = result.data.user;
          const rememberMe = sessionStorage.getItem('rememberMe') === 'true';
          const storage = rememberMe ? localStorage : sessionStorage;
          storage.setItem('user', JSON.stringify({
            user_id: user.user_id,
            email: user.email,
            profile_pic: user.profile_pic,
            point_bal: user.point_bal,
            trusting_score: user.trusting_score,
            is_student_id_verified: user.is_student_id_verified,
            is_hall_verified: user.is_hall_verified,
            total_favourites: user.total_favourites,
            has_unread_notifications: user.has_unread_notifications
          }));
          sessionStorage.removeItem('2fa_data');
          if (typeof showToast === 'function') {
            showToast('Login successful! Redirecting…', 'success');
          }
          setTimeout(() => {
            window.location.href = '/student/dashboard.html';
          }, 1000);
        } else {
          errorEl.textContent = result.message || 'Invalid code. Please try again.';
          errorEl.style.display = 'block';
          verifyBtn.disabled = false;
          verifyBtn.textContent = isBackupMode ? 'Verify Backup Code' : 'Verify';
        }
      } catch (err) {
        console.error('Verification error:', err);
        errorEl.textContent = 'Network error. Please try again.';
        errorEl.style.display = 'block';
        verifyBtn.disabled = false;
        verifyBtn.textContent = isBackupMode ? 'Verify Backup Code' : 'Verify';
      }
    });

  })();
</script>
<!-- Toast script from main.js -->
<script src="../assets/js/main.js"></script>
</body>
</html>
